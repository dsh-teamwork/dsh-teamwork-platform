  /teams/{teamId}/history/{id}/restore:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: An administrator prepares a historical resource as a new review draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
