# The DSH Teamwork API: what the console, the DSH plugin and the phone app
# call (docs/tech/go-server.md). Every response the Go server's tests see is
# validated against this file, and the console's types are generated from it
# (apps/web/src/lib/api.gen.ts). A route is added here in the same change
# that adds it to the server.
openapi: 3.0.3
info:
  title: DSH Teamwork
  version: '1'
  description: >
    Errors are `{ "error": <code> }` with a stable code a client branches on,
    plus `issues` when the request failed validation. A browser is signed in
    by a session cookie, and a write it sends must come from the site's own
    origin; the DSH plugin sends `Authorization: Bearer <token>`.
servers:
  - url: /api
security:
  - session: []
  - bearer: []
paths:
  /auth/session:
    get:
      summary: Who is signed in, and the doors this instance offers
      security: []
      responses:
        '200':
          description: The session, with `user` null when nobody is signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /auth/password/sign-in:
    post:
      parameters:
        - { name: next, in: query, schema: { type: string }, description: Local return path including the phone handoff when applicable }
      summary: Sign in with an email and a password (instances without SMTP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordSignIn' }
      responses:
        '200':
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema:
                type: object
                required: [mustChangePassword]
                properties:
                  mustChangePassword: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/setup:
    post:
      summary: Claim the first account with the link the server printed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Setup' }
      responses:
        '204': { description: Created and signed in }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/password/change:
    post:
      summary: Replace one's own password, checking the current one unless the session proved it
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePassword' }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/sign-out:
    post:
      summary: End the browser's session
      security: []
      responses:
        '204': { description: Signed out }
  /auth/plugin/code:
    post:
      summary: Confirm a plugin's sign-in and get a two-minute code bound to its challenge
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginCodeRequest' }
      responses:
        '200':
          description: The code, and where it may be sent instead of shown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginCode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: The phone handoff requires verification (verification_required) or the account cannot authorize it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/plugin/token:
    post:
      summary: Trade a code and the plugin's PKCE verifier for a Bearer token that lapses after 30 days unused (ADR 0060)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, verifier]
              properties:
                code: { type: string, minLength: 1 }
                verifier: { type: string, minLength: 43, maxLength: 128 }
      responses:
        '200':
          description: The token
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt:
                    type: string
                    format: date-time
                    description: When the token lapses if it is not used; every use moves this on, up to a year from sign-in
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      summary: Sign out a plugin or the app; the Bearer sent opens nothing from now on
      security: [{ bearer: [] }]
      responses:
        '204': { description: 'Revoked, or the token already opened nothing' }
  /teams:
    get:
      summary: The teams the caller is in, with their role in each
      responses:
        '200':
          description: The teams, the ones joined first first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, role, memberCount]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    role: { type: string, enum: [admin, member] }
                    memberCount: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a team; the caller is its admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: The team
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/providers:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: An admin lists the team's providers, never a key
      responses:
        '200':
          description: The providers, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Provider' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: An admin adds a provider; its key is write-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, baseUrl, apiKey]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                baseUrl: { type: string, maxLength: 500 }
                apiKey: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '201':
          description: The provider, never its key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/configs:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: One team's configuration, for any member
      responses:
        '200':
          description: The configuration, by kind and name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Config' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Publish a member-owned asset or configure a team-wide resource as administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigInput' }
      responses:
        '201':
          description: The stored configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/asset-choices:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: Read the caller's own choices, the team's recommendations, how many members use each asset, and withdrawn assets the caller still sees
      responses:
        '200':
          description: Asset selections
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetChoices' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/asset-choices/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Choose how the caller uses a preset or plugin
      description: >-
        latest follows every new version, pinned keeps one, removed takes it off the caller's DSH,
        and default drops the caller's choice so the team's recommendation applies. A team's own
        preset or plugin takes only removed and default; the team assistant takes neither.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalChoice' }
      responses:
        '204': { description: Choice saved }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/asset-choices/{id}/hosts:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace the caller's computers a preset or plugin stays off
      description: >-
        Every other computer the caller signs in on syncs it, a newly connected one included. The ids are
        the caller's own relay hosts; the team assistant stays on every computer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [off]
              properties:
                off: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 32 } }
      responses:
        '204': { description: Computers saved }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/asset-choices/{id}/here:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Put a preset or plugin on the calling computer alone, or take it off that computer
      description: >-
        For a DSH panel, whose plugin token names its computer once it has connected to the relay (else 409
        host_unknown). On adds an item the caller did not have and keeps it off their other computers, or brings
        back one they kept off this computer; off keeps it off this computer. The team assistant takes neither.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        '204': { description: Saved }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/asset-defaults/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Recommend a member's asset to the team at one version, rename or withdraw it, as an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 0, description: 0 withdraws the recommendation }
                name: { type: string, maxLength: 120 }
                revision: { type: integer, minimum: 0 }
      responses:
        '204': { description: Recommendation saved }
        default: { $ref: '#/components/responses/Error' }
  /configs:
    get:
      summary: What the plugin syncs — every team the caller is in, with its configuration
      description: A computer token (ADR 0038) receives its one team alone.
      responses:
        '200':
          description: The snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /llm/chat/completions:
    post:
      summary: The model gateway (OpenAI Chat Completions); `model` is a team configuration id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              additionalProperties: true
              properties:
                model: { type: string, minLength: 1 }
                messages: { type: array, minItems: 1, items: {} }
                stream: { type: boolean }
                reasoning_effort: { type: string, description: "One of the model configuration's reasoningEfforts; omitted, the provider's default applies" }
      responses:
        '200':
          description: The provider's answer, streamed through with none of its headers
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/email/send:
    post:
      summary: Email a six-digit sign-in code (instances with SMTP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '204': { description: Sent }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/email/verify:
    post:
      parameters:
        - { name: next, in: query, schema: { type: string }, description: Local return path including the phone handoff when applicable }
      summary: Sign in with the emailed code; a first sign-in makes the account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties: { email: { type: string }, code: { type: string, pattern: '^\d{6}$' } }
      responses:
        '204': { description: Signed in; the session cookie is set }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/google:
    get:
      summary: Go to Google; `next` is where to land after
      security: []
      parameters:
        - { name: next, in: query, schema: { type: string } }
      responses:
        '302': { description: 'To Google, or back to /sign-in?error= where Google is off' }
  /auth/callback/google:
    get:
      summary: Where Google returns; signs in and goes to `next`
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
      responses:
        '302': { description: 'Signed in and sent on, or back to /sign-in?error=' }
  /teams/{teamId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: A team the caller is in, their role and its members
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: "Its admin deletes the team, with everyone in it and everything it holds (ADR 0056); an edition may refuse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, minLength: 1, maxLength: 320, description: The team's name }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/membership:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    delete:
      summary: A member leaves the team; its admin cannot
      responses:
        '204': { description: Left }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/members:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      summary: An admin adds someone by email, where the instance holds passwords
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '201':
          description: The member, with a first password shown once, or null for an existing account
          content:
            application/json:
              schema:
                type: object
                required: [userId, email, password]
                properties:
                  userId: { type: string }
                  email: { type: string }
                  password: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/members/{userId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    delete:
      summary: An admin removes a member
      responses:
        '204': { description: 'Removed, or was not a member' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/members/{userId}/password:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    post:
      summary: An admin gives a member a new first password, shown once
      responses:
        '200':
          description: The password
          content:
            application/json:
              schema: { type: object, required: [password], properties: { password: { type: string } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/members/{userId}/admin:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    post:
      summary: The admin hands the admin role to a member and becomes a member
      responses:
        '204': { description: Handed over }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/invites:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: An admin lists the team's invitations, newest first
      responses:
        '200':
          description: The invitations, never their tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Invite' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: An admin creates a single-use invitation good for a day
      responses:
        '201':
          description: The invitation and its token, the only time it is seen
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Invite' }
                  - { type: object, required: [token], properties: { token: { type: string } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/invites/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: An admin revokes an invitation
      responses:
        '204': { description: 'Revoked, or was not there' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /invites/redeem:
    post:
      summary: Spend an invitation token and join its team
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string, minLength: 32, maxLength: 100 } } }
      responses:
        '200':
          description: The team joined
          content:
            application/json:
              schema: { type: object, required: [teamId], properties: { teamId: { type: string } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/configs/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Edit a configuration as its owner, naming the version it read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/ConfigInput' }
                - { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }
      responses:
        '200':
          description: The configuration at its new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Archive a member-owned asset or remove a team configuration
      responses:
        '204': { description: 'Removed, or was not there' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/providers/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: An admin moves a provider or replaces its key; the name stays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl]
              properties:
                baseUrl: { type: string, maxLength: 500 }
                apiKey: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: The provider, never its key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: An admin removes a provider no model or preset calls
      responses:
        '204': { description: 'Removed, or was not there' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/model-catalog:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: provider, in: query, required: true, schema: { type: string, minLength: 1 } }
    get:
      summary: One provider's models, for an admin choosing team models
      responses:
        '200':
          description: The models, with only the limits the provider states
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalog' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/model-metadata/lookup:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      summary: Query a public upstream live for transient model form suggestions
      description: No cache, persistence or configuration association. Prices are base USD per million text tokens; conditional and non-token charges are not represented. For models_dev, a provider the catalog does not name (or none) searches every provider for the exact model id instead of a substring. A catalog that cannot be read is model_metadata_unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, query]
              properties:
                source: { type: string, enum: [models_dev, openrouter] }
                provider: { type: string, maxLength: 100 }
                query: { type: string, minLength: 1, maxLength: 200 }
                pricing: { type: boolean }
      responses:
        '200':
          description: Up to fifty candidates, exact id first; the console fills the form only from a unique exact match
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models: { type: array, items: { $ref: '#/components/schemas/ModelMetadata' } }
                  usdToCny: { type: string, description: "Latest live reference exchange rate, omitted on failure" }
                  exchangeDate: { type: string, format: date }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/providers/check:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      summary: An admin reads a model list with an address and key before saving either
      description: >
        Nothing is stored. The address rule holds as it does for saving. A key
        the provider answers 401 or 403 to is provider_key_rejected; any other
        failure to read the list is upstream_unavailable, since a provider may
        simply not list its models.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl, apiKey]
              properties:
                baseUrl: { type: string }
                apiKey: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: The models the key can read; provider is empty, since nothing is saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalog' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/budgets:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: Read scoped budget policies and current usage windows
