      summary: Where the relay's plugin socket is (ADR 0044; docs/tech/relay.md)
      security: []
      responses:
        '200':
          description: The plugin socket's address
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties: { url: { type: string } }
  /teams/{teamId}/shared-hosts:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: A team's shared DSHs, for a team admin's browser session (docs/tech/shared-dsh.md)
      security: [{ session: [] }]
      responses:
        '200':
          description: >-
            The shared DSHs, oldest first, and whether the team may run one now: an
            edition's gate can keep a team out (the hosted service admits teams one
            by one), when creating or rotating a key answers 403 team_dsh_unavailable
            and its DSHs and members are cut off; a self-hosted server has no gate.
          content:
            application/json:
              schema:
                type: object
                required: [available, hosts]
                properties:
                  available: { type: boolean }
                  hosts: { type: array, items: { $ref: '#/components/schemas/SharedHost' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a shared DSH; its team host key is shown this once
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharedHostName' }
      responses:
        '201':
          description: The shared DSH and its key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedHostKey' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/shared-hosts/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Rename a shared DSH
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharedHostName' }
      responses:
        '200':
          description: The shared DSH
          content:
            application/json:
              schema:
                type: object
                required: [host]
                properties: { host: { $ref: '#/components/schemas/SharedHost' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a shared DSH; its key stops at once
      security: [{ session: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/shared-hosts/{id}/rotate:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Give a shared DSH a new key, keeping its machine; shown this once
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The shared DSH and its new key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedHostKey' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/shared-hosts/{id}/members:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Who may reach a shared DSH; anyone else's pairings with it end at once
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access, userIds]
              additionalProperties: false
              properties:
                access: { type: string, enum: [team, listed] }
                userIds: { type: array, items: { type: string }, description: The team members a listed host admits }
      responses:
        '200':
          description: The shared DSH
          content:
            application/json:
              schema:
                type: object
                required: [host]
                properties: { host: { $ref: '#/components/schemas/SharedHost' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/shared-archive:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: Every shared DSH's audit archive, deleted hosts included (team admins)
      security: [{ session: [] }]
      responses:
        '200':
          description: One summary per shared DSH that uploaded a segment
          content:
            application/json:
              schema:
                type: object
                required: [hosts]
                properties:
                  hosts: { type: array, items: { $ref: '#/components/schemas/SharedArchiveHost' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/shared-archive/{hostId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: hostId, in: path, required: true, schema: { type: string } }
    get:
      summary: "One shared DSH's archive: its segments in order, one per line, exactly as uploaded (team admins)"
      security: [{ session: [] }]
      responses:
        '200':
          description: 'Sealed segments, read with dsh-teamwork-audit read and the admin''s own key'
          content:
            application/x-ndjson:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /relay/shared:
    servers: [{ url: / }]
    get:
      summary: The shared DSHs the caller may reach
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200':
          description: The shared DSHs, oldest first, and the caller's teams that may not run one
          content:
            application/json:
              schema:
                type: object
                required: [hosts, unavailableTeamIds]
                properties:
                  unavailableTeamIds:
                    type: array
                    description: The caller's teams the hosted service has not enabled Team DSH for; a self-hosted server lists none.
                    items: { type: string }
                  hosts:
                    type: array
                    items:
                      type: object
                      required: [id, name, teamId, teamName, online]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        teamId: { type: string }
                        teamName: { type: string }
                        online: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
