# The DSH Teamwork API: what the console, the DSH plugin and the phone app
# call (docs/tech/go-server.md). Every response the Go server's tests see is
# validated against this file, and the console's types are generated from it
# (apps/console/src/lib/api.gen.ts). A route is added here in the same change
# that adds it to the server.
openapi: 3.0.3
info:
  title: DSH Teamwork
  version: '1'
  description: >
    Errors are `{ "error": <code> }` with a stable code a client branches on,
    plus `issues` when the request failed validation. A browser is signed in
    by a session cookie, and a write it sends must come from the site's own
    origin; the DSH plugin sends `Authorization: Bearer <token>`.
servers:
  - url: /api
security:
  - session: []
  - bearer: []
paths:
  /auth/session:
    get:
      summary: Who is signed in, and the doors this instance offers
      security: []
      responses:
        '200':
          description: The session, with `user` null when nobody is signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /auth/password/sign-in:
    post:
      summary: Sign in with an email and a password (instances without SMTP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordSignIn' }
      responses:
        '200':
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema:
                type: object
                required: [mustChangePassword]
                properties:
                  mustChangePassword: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/setup:
    post:
      summary: Claim the first account with the link the server printed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Setup' }
      responses:
        '204': { description: Created and signed in }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/password/change:
    post:
      summary: Replace one's own password, checking the current one
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePassword' }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/sign-out:
    post:
      summary: End the browser's session
      security: []
      responses:
        '204': { description: Signed out }
  /auth/plugin/code:
    post:
      summary: Confirm a plugin's sign-in and get a two-minute code bound to its challenge
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginCodeRequest' }
      responses:
        '200':
          description: The code, and where it may be sent instead of shown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginCode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/plugin/token:
    post:
      summary: Trade a code and the plugin's PKCE verifier for a 30-day Bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, verifier]
              properties:
                code: { type: string, minLength: 1 }
                verifier: { type: string, minLength: 43, maxLength: 128 }
      responses:
        '200':
          description: The token
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /teams:
    get:
      summary: The teams the caller is in, with their role in each
      responses:
        '200':
          description: The teams, the ones joined first first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, role, memberCount]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    role: { type: string, enum: [admin, member] }
                    memberCount: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a team; the caller is its admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: The team
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/providers:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: An admin lists the team's providers, never a key
      responses:
        '200':
          description: The providers, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Provider' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: An admin adds a provider; its key is write-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, baseUrl, apiKey]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                baseUrl: { type: string, maxLength: 500 }
                apiKey: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '201':
          description: The provider, never its key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/configs:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: One team's configuration, for any member
      responses:
        '200':
          description: The configuration, by kind and name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Config' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: An admin publishes a model, preset or plugin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigInput' }
      responses:
        '201':
          description: The stored configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /configs:
    get:
      summary: What the plugin syncs — every team the caller is in, with its configuration
      responses:
        '200':
          description: The snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /llm/chat/completions:
    post:
      summary: The model gateway (OpenAI Chat Completions); `model` is a team configuration id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              additionalProperties: true
              properties:
                model: { type: string, minLength: 1 }
                messages: { type: array, minItems: 1, items: {} }
                stream: { type: boolean }
      responses:
        '200':
          description: The provider's answer, streamed through with none of its headers
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/email/send:
    post:
      summary: Email a six-digit sign-in code (instances with SMTP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '204': { description: Sent }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/email/verify:
    post:
      summary: Sign in with the emailed code; a first sign-in makes the account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties: { email: { type: string }, code: { type: string, pattern: '^\d{6}$' } }
      responses:
        '204': { description: Signed in; the session cookie is set }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/google:
    get:
      summary: Go to Google; `next` is where to land after
      security: []
      parameters:
        - { name: next, in: query, schema: { type: string } }
      responses:
        '302': { description: 'To Google, or back to /sign-in?error= where Google is off' }
  /auth/callback/google:
    get:
      summary: Where Google returns; signs in and goes to `next`
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
      responses:
        '302': { description: 'Signed in and sent on, or back to /sign-in?error=' }
  /teams/{teamId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: A team the caller is in, their role and its members
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/membership:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    delete:
      summary: A member leaves the team; its admin cannot
      responses:
        '204': { description: Left }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/members:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      summary: An admin adds someone by email, where the instance holds passwords
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '201':
          description: The member, with a first password shown once, or null for an existing account
          content:
            application/json:
              schema:
                type: object
                required: [userId, email, password]
                properties:
                  userId: { type: string }
                  email: { type: string }
                  password: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/members/{userId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    delete:
      summary: An admin removes a member
      responses:
        '204': { description: 'Removed, or was not a member' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/members/{userId}/password:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    post:
      summary: An admin gives a member a new first password, shown once
      responses:
        '200':
          description: The password
          content:
            application/json:
              schema: { type: object, required: [password], properties: { password: { type: string } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/members/{userId}/admin:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    post:
      summary: The admin hands the admin role to a member and becomes a member
      responses:
        '204': { description: Handed over }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/invites:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: An admin lists the team's invitations, newest first
      responses:
        '200':
          description: The invitations, never their tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Invite' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: An admin creates a single-use invitation good for a day
      responses:
        '201':
          description: The invitation and its token, the only time it is seen
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Invite' }
                  - { type: object, required: [token], properties: { token: { type: string } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/invites/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: An admin revokes an invitation
      responses:
        '204': { description: 'Revoked, or was not there' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /invites/redeem:
    post:
      summary: Spend an invitation token and join its team
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string, minLength: 32, maxLength: 100 } } }
      responses:
        '200':
          description: The team joined
          content:
            application/json:
              schema: { type: object, required: [teamId], properties: { teamId: { type: string } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/configs/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: An admin edits a configuration, naming the version it read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/ConfigInput' }
                - { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }
      responses:
        '200':
          description: The configuration at its new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: An admin removes a configuration no preset still uses
      responses:
        '204': { description: 'Removed, or was not there' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/providers/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: An admin moves a provider or replaces its key; the name stays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl]
              properties:
                baseUrl: { type: string, maxLength: 500 }
                apiKey: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: The provider, never its key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: An admin removes a provider no model or preset calls
      responses:
        '204': { description: 'Removed, or was not there' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/model-catalog:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: provider, in: query, required: true, schema: { type: string, minLength: 1 } }
    get:
      summary: One provider's models, for an admin choosing team models
      responses:
        '200':
          description: The models, with only the limits the provider states
          content:
            application/json:
              schema:
                type: object
                required: [provider, models]
                properties:
                  provider: { type: string }
                  models:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      additionalProperties: false
                      properties:
                        id: { type: string }
                        name: { type: string }
                        contextWindow: { type: integer }
                        maxTokens: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/budgets:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: Read scoped budget policies and current usage windows
      responses:
        '200':
          description: Admin team view or member's applicable policies and windows
          content:
            application/json:
              schema:
                type: object
                required: [policies, windows, summary]
                properties:
                  policies: { type: array, items: { $ref: '#/components/schemas/BudgetPolicy' } }
                  windows: { type: array, items: { $ref: '#/components/schemas/BudgetWindow' } }
                  summary: { $ref: '#/components/schemas/QuotaSummary' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: An admin edits a budget without resetting its period spend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetPolicyInput' }
      responses:
        '200':
          description: Updated policy with any scheduled timezone transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetPolicy' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/budgets/notices:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: Read recent budget mail delivery status within your permission scope
      responses:
        '200':
          description: Most recent 30 notices; members only see their own
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BudgetNotice' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/budgets/notices/{noticeId}/retry:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: noticeId, in: path, required: true, schema: { type: string } }
    post:
      summary: An admin retries failed mail after its cooldown
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '204': { description: Queued again without duplicating a successful delivery }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/usage/{requestId}/resolve:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      summary: An admin records an explicit BYOK usage estimate with retained evidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageResolution' }
      responses:
        '204': { description: Resolved once; prior evidence and actor are preserved }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/model-rates/{configId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: configId, in: path, required: true, schema: { type: string } }
    get:
      summary: Read a model's reference price and revision
      responses:
        '200':
          description: Configured rate or an unpriced model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRate' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: An admin publishes a new immutable reference-price version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelRateInput' }
      responses:
        '200':
          description: The new reference price
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRate' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/summary:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: Read what waits on the caller and the last 30 days' usage, for the team's overview
      responses:
        '200':
          description: An admin's team-wide summary, or a member's own calls and the limits that apply to them
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamSummary' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/usage:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: An admin reads team usage; a member reads only their own
      parameters:
        - { name: userId, in: query, schema: { type: string } }
        - { name: configId, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: Scoped usage; null points mean unpriced or unsettled
          content:
            application/json:
              schema:
                type: object
                required: [entries, total, page, size]
                properties:
                  entries: { type: array, items: { $ref: '#/components/schemas/UsageEntry' } }
                  total: { type: integer }
                  page: { type: integer }
                  size: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/usage/export:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: Export up to 10000 scoped calls; members can export only their own
      parameters:
        - { name: userId, in: query, schema: { type: string } }
        - { name: configId, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: UTF-8 CSV with immutable identifiers, null values left empty, and formula-safe text
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /locale:
    post:
      summary: Choose the interface language
      description: >
        Sets the `locale` cookie (a year, path /) for anybody, and the
        profile's locale too when signed in, so the choice follows the account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale: { type: string, enum: [en, zh-CN] }
      responses:
        '204': { description: Chosen }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /profile:
    get:
      summary: The signed-in profile
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      summary: Change the name or the locale; null clears it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, nullable: true, minLength: 1, maxLength: 80 }
                locale: { type: string, nullable: true, enum: [en, zh-CN, null] }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      summary: "Delete the account, from a session or the app's token, with every team it is alone in; refused while it administers a team with others"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, minLength: 1, maxLength: 320, description: The account's email }
      responses:
        '204': { description: Deleted; the session cookie is cleared }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/submissions:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: Own submissions; administrators see the team
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: state, in: query, description: Keep only submissions in this state, schema: { type: string, enum: [draft, pending, published, rejected, withdrawn] } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ResourceSubmission' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Create a private submission draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionInput' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceSubmission' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/submissions/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Read the exact owned submission or review it as administrator
      responses:
        '200':
          description: Frozen proposal and current revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceSubmission' }
        default: { $ref: '#/components/responses/Error' }
    put:
      summary: Edit an owned draft at its current revision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionInput' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceSubmission' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/submissions/{id}/{action}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [submit, approve, reject, withdraw] } }
    post:
      summary: Submit, withdraw, or explicitly review the frozen proposal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceSubmission' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/artifacts:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      summary: Upload an npm archive privately, up to 10 MiB
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Private artifact metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceArtifact' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/artifacts/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Inspect an authorized artifact and its included files
      responses:
        '200':
          description: Private artifact metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceArtifact' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/artifacts/{id}/download:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Download a private plugin archive after a live membership check
      responses:
        '200':
          description: Exact immutable plugin bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/history:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: Immutable publication history for team members, newest first
      parameters:
        - { name: configId, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [model, preset, plugin] } }
        - { name: authorId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: At most fifty immutable publications
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ConfigRevision' } }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/history/{id}/restore:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: An administrator prepares a historical resource as a new review draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion, note]
              additionalProperties: false
              properties:
                baseVersion: { type: integer, minimum: 0 }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Restore draft; not published until submitted and approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceSubmission' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/history/{id}/export:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Export a resource manifest and retained plugin artifacts; administrator only
      responses:
        '200':
          description: Backup archive, without provider keys or authentication material
          content:
            application/gzip:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: dsh-teamwork-session }
    bearer:
      type: http
      scheme: bearer
      description: A plugin token. GET /api/configs and the model gateway also accept a computer token (ADR 0038), limited to its one team.
  responses:
    Error:
      description: A refusal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    BudgetNotice:
      type: object
      required: [id, recipientId, threshold, state, createdAt, nextAt, code]
      properties:
        id: { type: string }
        recipientId: { type: string }
        threshold: { type: integer }
        state: { type: string, enum: [pending, sending, sent, failed, skipped] }
        createdAt: { type: string, format: date-time }
        nextAt: { type: string, format: date-time }
        code: { type: string }
    UsageResolution:
      type: object
      required: [reason, tokens, points]
      properties:
        reason: { type: string, minLength: 8, maxLength: 500 }
        points: { type: string, nullable: true }
        tokens:
          type: object
          required: [input, cacheRead, cacheWrite, output, reasoning]
          properties:
            input: { type: integer, minimum: 0 }
            cacheRead: { type: integer, minimum: 0 }
            cacheWrite: { type: integer, minimum: 0 }
            output: { type: integer, minimum: 0 }
            reasoning: { type: integer, minimum: 0 }
    BudgetPolicyInput:
      type: object
      required: [scope, subjectId, period, timezone, revision, enabled, notify, points, input, output, total]
      properties:
        scope: { type: string, enum: [team, member, default_member, provider] }
        subjectId: { type: string }
        period: { type: string, enum: [day, month] }
        timezone: { type: string }
        revision: { type: integer }
        enabled: { type: boolean }
        notify: { type: string, enum: [admins, owner, both, none] }
        points: { type: string, nullable: true }
        input: { type: integer, nullable: true }
        output: { type: integer, nullable: true }
        total: { type: integer, nullable: true }
    BudgetPolicy:
      allOf:
        - { $ref: '#/components/schemas/BudgetPolicyInput' }
        - type: object
          required: [id, activeTimezone, effectiveAt, inheritsDefault]
          properties:
            id: { type: string }
            activeTimezone: { type: string }
            effectiveAt: { type: string, nullable: true, format: date-time }
            inheritsDefault: { type: boolean }
    TeamSummary:
      type: object
      required: [since, calls, points, unpriced, unresolved, failedNotices, nearLimit, budget, pendingReviews]
      properties:
        since: { type: string, format: date-time, description: "Start of the counted period, 30 days back" }
        calls: { type: integer, minimum: 0, description: "Model calls in the period; the team's for an admin, the caller's own for a member" }
        points: { type: string, description: "Reference points spent in the period: priced model calls and edition meters" }
        unpriced: { type: integer, minimum: 0, description: "Calls in the period without a price yet, which points leaves out" }
        unresolved: { type: integer, minimum: 0, description: "Model calls an admin must resolve, from any time; 0 for a member. Metered rows are settled by their edition" }
        failedNotices: { type: integer, minimum: 0, description: "Budget mail that could not be delivered; 0 for a member" }
        nearLimit:
          type: array
          description: Open budget windows at or past a notice threshold
          items:
            type: object
            required: [scope, subjectId, period, threshold]
            properties:
              scope: { type: string, enum: [team, member, provider] }
              subjectId: { type: string }
              period: { type: string, enum: [day, month] }
              threshold: { type: integer, enum: [80, 95, 100] }
        budget: { $ref: '#/components/schemas/QuotaSummary' }
        pendingReviews: { type: integer, minimum: 0, description: "Submissions awaiting review; the team's for an admin, the caller's own for a member" }
    QuotaSummary:
      type: object
      required: [remaining, state, resetAt, tokenLimited, exhausted]
      properties:
        remaining: { type: string, nullable: true, description: "Smallest current team/member points allowance after holds; advisory, not a wallet balance" }
        state: { type: string, enum: [known, unlimited, unconfirmed] }
        resetAt: { type: string, nullable: true, format: date-time, description: Earliest active policy boundary; other limits may remain exhausted afterwards. }
        tokenLimited: { type: boolean }
        exhausted: { type: boolean }
    BudgetWindow:
      type: object
      required: [id, scope, subjectId, period, startsAt, endsAt, spent, reserved, pointLimit, remaining, inputSpent, inputReserved, outputSpent, outputReserved, unpriced, unbounded]
      properties:
        id: { type: string }
        scope: { type: string, enum: [team, member, provider] }
        subjectId: { type: string }
        period: { type: string, enum: [day, month] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        spent: { type: string }
        reserved: { type: string }
        pointLimit: { type: string, nullable: true, description: Effective enabled points ceiling; null means no points cap }
        remaining: { type: string, nullable: true, description: Ceiling minus spent and reserved; null for unlimited or unconfirmed usage }
        inputSpent: { type: integer }
        inputReserved: { type: integer }
        outputSpent: { type: integer }
        outputReserved: { type: integer }
        unpriced: { type: integer }
        unbounded: { type: integer }
    ModelRateInput:
      type: object
      required: [revision, basis, input, cacheRead, cacheWrite, output]
      properties:
        revision: { type: integer, minimum: 0, maximum: 1000000000 }
        basis: { type: string, enum: [cost, weight] }
        input: { type: string }
        cacheRead: { type: string }
        cacheWrite: { type: string }
        output: { type: string }
    ModelRate:
      allOf:
        - { $ref: '#/components/schemas/ModelRateInput' }
        - type: object
          required: [configured]
          properties:
            readOnly: { type: boolean }
            configured: { type: boolean }
    UsageEntry:
      type: object
      required: [id, userId, configId, provider, model, state, code, createdAt, finishedAt, input, cacheRead, cacheWrite, output, reasoning, points, meter]
      properties:
        id: { type: string }
        userId: { type: string }
        configId: { type: string }
        provider: { type: string }
        model: { type: string }
        state: { type: string, enum: [running, settled, unpriced, pending, failed, estimated] }
        code: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, nullable: true, format: date-time }
        input: { type: integer, nullable: true }
        cacheRead: { type: integer, nullable: true }
        cacheWrite: { type: integer, nullable: true }
        output: { type: integer, nullable: true }
        reasoning: { type: integer, nullable: true }
        points: { type: string, nullable: true }
        meter:
          description: An edition's metered usage (ADR 0036); null on a model call.
          type: object
          nullable: true
          required: [name, unit, quantity, labels, unitLabels]
          properties:
            name: { type: string }
            unit: { type: string }
            quantity: { type: integer, nullable: true }
            labels: { type: object, additionalProperties: { type: string } }
            unitLabels: { type: object, additionalProperties: { type: string } }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        scope: { type: string }
        resetAt: { type: string, format: date-time }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: array, items: { oneOf: [{ type: string }, { type: integer }] } }
              message: { type: string }
    Session:
      type: object
      required: [user, doors, setupOpen, mobileRedirectPrefix, teamPages]
      properties:
        user:
          type: object
          nullable: true
          required: [id, email, name, mustChangePassword]
          properties:
            id: { type: string }
            email: { type: string, nullable: true }
            name: { type: string, nullable: true }
            mustChangePassword: { type: boolean }
        doors:
          type: object
          required: [password, emailCode, google]
          properties:
            password: { type: boolean }
            emailCode: { type: boolean }
            google: { type: boolean }
        setupOpen: { type: boolean }
        mobileRedirectPrefix: { type: string }
        teamPages:
          type: array
          items:
            type: object
            required: [path, labels]
            properties:
              path: { type: string }
              labels:
                type: object
                required: [en, zh-CN]
                properties:
                  en: { type: string }
                  zh-CN: { type: string }
    PasswordSignIn:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    Setup:
      type: object
      required: [token, email, password]
      properties:
        token: { type: string }
        email: { type: string }
        password: { type: string, minLength: 10, maxLength: 256 }
    ChangePassword:
      type: object
      required: [current, next]
      properties:
        current: { type: string }
        next: { type: string, minLength: 10, maxLength: 256 }
    PluginCodeRequest:
      type: object
      required: [challenge]
      properties:
        challenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        redirectUri: { type: string }
    PluginCode:
      type: object
      required: [code, returnTo]
      properties:
        code: { type: string }
        returnTo:
          type: object
          nullable: true
          required: [url, to]
          properties:
            url: { type: string }
            to: { type: string, enum: [dsh, app] }
    Provider:
      type: object
      required: [id, name, baseUrl, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        baseUrl: { type: string }
        updatedAt: { type: string, format: date-time }
    Tokens: { type: integer, minimum: 1, maximum: 10000000 }
    ModelData:
      type: object
      required: [provider, model]
      additionalProperties: false
      properties:
        provider: { type: string }
        model: { type: string }
        contextWindow: { $ref: '#/components/schemas/Tokens' }
        maxTokens: { $ref: '#/components/schemas/Tokens' }
    PresetData:
      type: object
      additionalProperties: false
      description: Inherits the session model, references a team model, or names a provider/model; exactly one choice.
      properties:
        inheritModel: { type: boolean }
        provider: { type: string }
        model: { type: string }
        contextWindow: { $ref: '#/components/schemas/Tokens' }
        maxTokens: { $ref: '#/components/schemas/Tokens' }
        modelConfigId: { type: string }
        description: { type: string }
        instructions: { type: string }
        outputDescription: { type: string }
        pluginDependencies:
          type: array
          items:
            type: object
            required: [pluginConfigId, version]
            properties:
              pluginConfigId: { type: string }
              version: { type: string }
        requiredTools: { type: array, items: { type: string } }
        optionalTools: { type: array, items: { type: string } }
        systemPrompt: { type: string }
    PluginData:
      type: object
      required: [package, version]
      additionalProperties: false
      properties:
        artifactId: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        package: { type: string }
        version: { type: string }
        providesTools: { type: array, items: { type: string } }
        description: { type: string }
    ConfigInput:
      type: object
      required: [kind, name, data]
      properties:
        kind: { type: string, enum: [model, preset, plugin] }
        name: { type: string, minLength: 1, maxLength: 120 }
        data:
          oneOf:
            - { $ref: '#/components/schemas/ModelData' }
            - { $ref: '#/components/schemas/PresetData' }
            - { $ref: '#/components/schemas/PluginData' }
    Config:
      type: object
      required: [id, kind, name, data, version, updatedAt]
      properties:
        builtin: { type: string, enum: [team-assistant] }
        owner: { type: string, description: Protected route owner; absent for ordinary BYOK configurations. }
        id: { type: string }
        kind: { type: string, enum: [model, preset, plugin] }
        name: { type: string }
        data:
          type: object
          additionalProperties: true
          description: The kind's data (ModelData, PresetData or PluginData) as stored.
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    Snapshot:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items:
            type: object
            required: [teamId, teamName, role, configs]
            properties:
              teamId: { type: string }
              teamName: { type: string }
              role: { type: string, enum: [admin, member] }
              configs: { type: array, items: { $ref: '#/components/schemas/Config' } }
              pluginVersions:
                type: array
                items:
                  type: object
                  required: [configId, name, data]
                  properties:
                    configId: { type: string }
                    name: { type: string }
                    data: { $ref: '#/components/schemas/PluginData' }
    Team:
      type: object
      required: [id, name, role, members]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, member] }
        members:
          type: array
          items:
            type: object
            required: [userId, email, role]
            properties:
              userId: { type: string }
              email: { type: string, nullable: true }
              role: { type: string, enum: [admin, member] }
    Invite:
      type: object
      required: [id, expiresAt, usedAt]
      properties:
        id: { type: string }
        expiresAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time, nullable: true }
    Profile:
      type: object
      required: [id, email, name, image, locale]
      additionalProperties: false
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
        name: { type: string, nullable: true }
        image: { type: string, nullable: true }
        locale: { type: string, nullable: true, enum: [en, zh-CN, null] }
    SubmissionInput:
      type: object
      required: [config, baseVersion, note]
      additionalProperties: false
      properties:
        config: { $ref: '#/components/schemas/ConfigInput' }
        configId: { type: string }
        baseVersion: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 2000 }
    ReviewInput:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 2000 }
    ResourceSubmission:
      type: object
      required: [id, configId, baseVersion, proposal, note, authorId, state, revision, reviewerId, reason, createdAt, updatedAt, decidedAt]
      properties:
        id: { type: string }
        configId: { type: string }
        baseVersion: { type: integer }
        proposal: { $ref: '#/components/schemas/ConfigInput' }
        note: { type: string }
        authorId: { type: string }
        state: { type: string, enum: [draft, pending, published, rejected, withdrawn] }
        revision: { type: integer }
        reviewerId: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    ResourceArtifact:
      type: object
      required: [id, package, version, sha256, size, files, published]
      properties:
        id: { type: string }
        package: { type: string }
        version: { type: string }
        sha256: { type: string }
        size: { type: integer, minimum: 0 }
        files: { type: array, items: { type: string } }
        published: { type: boolean }
    ConfigRevision:
      type: object
      required: [id, configId, kind, name, data, version, authorId, reviewerId, note, source, createdAt]
      properties:
        id: { type: string }
        configId: { type: string }
        kind: { type: string, enum: [model, preset, plugin] }
        name: { type: string }
        data: { type: object, additionalProperties: true }
        version: { type: integer, minimum: 1 }
        authorId: { type: string }
        reviewerId: { type: string }
        note: { type: string }
        source: { type: string, enum: [system, legacy, direct, approved] }
        createdAt: { type: string, format: date-time }
