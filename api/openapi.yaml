    put:
      summary: Edit an owned draft at its current revision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionInput' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceSubmission' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/submissions/{id}/{action}:
