            schema: { $ref: '#/components/schemas/SubmissionInput' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceSubmission' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/submissions/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
