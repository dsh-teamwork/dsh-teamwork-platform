              properties:
                locale: { type: string, enum: [en, zh-CN] }
      responses:
        '204': { description: Chosen }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /profile:
    get:
      summary: The signed-in profile
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      summary: Change the name or the locale; null clears it
      requestBody:
        required: true
        content:
          application/json:
            schema:
