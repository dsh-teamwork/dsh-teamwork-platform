        required: true
        content:
          application/json:
            schema: { type: object, required: [deviceName], properties: { deviceName: { type: string } } }
      responses:
        '201':
          description: The pending pairing
          content:
            application/json:
              schema:
                type: object
                required: [pairing]
                properties: { pairing: { $ref: '#/components/schemas/RelayPairing' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /relay/shared/archive:
    servers: [{ url: / }]
    post:
      summary: A shared DSH uploads the next segment of its sealed audit archive
      security: [{ bearer: [] }]
      description: 'The DSH''s host token. The segment must be signed by the identity key the host bound and be the next in its chain; a retried upload of the last segment answers 200.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharedArchiveSegment' }
      responses:
        '201':
          description: The segment is kept
          content:
            application/json:
              schema: { type: object, required: [seq, digest], properties: { seq: { type: integer }, digest: { type: string } } }
        '200':
          description: The segment was already kept
          content:
            application/json:
              schema: { type: object, required: [seq, digest], properties: { seq: { type: integer }, digest: { type: string } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: Not the next segment in the chain
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties: { error: { type: string }, next: { type: integer }, prev: { type: string } }
        '413': { $ref: '#/components/responses/Error' }
  /relay/plugin:
    servers: [{ url: / }]
    get:
      summary: The plugin's relay socket (WebSocket); its first frame is a hello with its Bearer token
      security: []
      responses:
        '101':
          description: Switched to the relay's frames (docs/tech/relay.md, Frames)
  /relay/phone:
    servers: [{ url: / }]
    get:
      summary: A phone's or a browser's relay socket (WebSocket); its first frame is a hello with its token and handset credential
      description: 'A page of this site may leave the token out: its session cookie, with an Origin of APP_URL, admits it instead.'
      security: []
      responses:
        '101':
          description: Switched to the relay's frames (docs/tech/relay.md, Frames)
  /relay/pair:
    servers: [{ url: / }]
    post:
      summary: A phone redeems a pairing code its owner's DSH showed
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: X-Device-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, deviceName]
              properties: { code: { type: string }, deviceName: { type: string } }
      responses:
        '201':
          description: The pending pairing
          content:
            application/json:
              schema:
                type: object
                required: [pairing]
                properties: { pairing: { $ref: '#/components/schemas/RelayPairing' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /relay/pairings:
    servers: [{ url: / }]
    get:
      summary: This handset's pairings
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: X-Device-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: The pairings
          content:
            application/json:
              schema:
                type: object
                required: [pairings]
                properties: { pairings: { type: array, items: { $ref: '#/components/schemas/RelayPairing' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /relay/hosts:
    servers: [{ url: / }]
    get:
      summary: The member's own computers, each with every device of theirs paired to it (the web console only, ADR 0048)
      security: [{ session: [] }]
      parameters:
        - { name: X-Device-Key, in: header, required: false, schema: { type: string }, description: "This browser's handset credential, to mark its own pairings" }
      responses:
        '200':
          description: The computers, most recently seen first
          content:
            application/json:
              schema:
                type: object
                required: [hosts]
                properties: { hosts: { type: array, items: { $ref: '#/components/schemas/RelayHost' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /relay/pairings/{id}:
    servers: [{ url: / }]
    delete:
      summary: Revoke a pairing; an app's own handset's, or from the web console any of the member's own computers' (ADR 0048)
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Device-Key, in: header, required: false, schema: { type: string }, description: "The app's handset credential; the web console need not send it" }
      responses:
        '204': { description: Revoked }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /relay/pairings/{id}/push:
    servers: [{ url: / }]
    put:
      summary: Turn a pairing's notifications on (an Expo push token) or off (null)
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Device-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken]
              properties: { pushToken: { type: string, nullable: true }, locale: { type: string } }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /relay/shared/challenge:
    servers: [{ url: / }]
    post:
      summary: A two-minute nonce for a team host key's exchange (ADR 0047)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [key], properties: { key: { type: string } } }
      responses:
        '200':
          description: The nonce
          content:
            application/json:
              schema:
                type: object
                required: [nonce, expiresAt]
                properties: { nonce: { type: string }, expiresAt: { type: string, format: date-time } }
        '400': { $ref: '#/components/responses/Error' }
  /relay/shared/token:
    servers: [{ url: / }]
    post:
      summary: Trade a team host key and a signature of the nonce by the DSH's identity key for a host token
      description: >-
        The first exchange binds the key to that identity; another identity is
        refused with `host_bound_elsewhere`. The signature covers
        "dsh-teamwork shared host\n" + nonce + "\n" + host id + "\n" + APP_URL.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, publicKey, nonce, signature]
              properties:
                key: { type: string }
                publicKey: { type: string, description: 'The raw Ed25519 public key, base64' }
                nonce: { type: string }
                signature: { type: string, description: 'Ed25519, base64' }
      responses:
        '200':
          description: A host token for the shared DSH's team
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, hostId, teamId, name]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  hostId: { type: string }
                  teamId: { type: string }
                  name: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: dsh-teamwork-session }
    bearer:
      type: http
      scheme: bearer
      description: A plugin token. GET /api/configs and the model gateway also accept a computer token (ADR 0038), limited to its one team.
  responses:
    Error:
      description: A refusal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    SharedHost:
      type: object
      required: [id, name, bound, boundAt, lastSeenAt, createdAt, access, memberIds]
      properties:
        id: { type: string }
        name: { type: string }
        bound: { type: boolean, description: Whether a machine has bound the key }
        boundAt: { type: string, format: date-time, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        access: { type: string, enum: [team, listed], description: 'Every team member reaches it, or only those listed' }
        memberIds: { type: array, items: { type: string } }
    SharedArchiveHost:
      type: object
      required: [hostId, name, deleted, segments, firstAt, lastAt, lastSeq, lastDigest]
      properties:
        hostId: { type: string }
        name: { type: string, description: The shared DSH's name; empty once it was deleted }
        deleted: { type: boolean }
        segments: { type: integer }
        firstAt: { type: string, format: date-time }
        lastAt: { type: string, format: date-time }
        lastSeq: { type: integer }
        lastDigest: { type: string, description: SHA-256 of the last segment's bytes }
    SharedArchiveSegment:
      type: object
      required: [v, host, seq, prev, key, enc, ct, sig]
      additionalProperties: false
      properties:
        v: { type: integer, enum: [1] }
        host: { type: string }
        seq: { type: integer, minimum: 1 }
        prev: { type: string, description: 'SHA-256 of the previous segment''s bytes, empty for the first' }
        key: { type: string, description: SHA-256 of the audit public key }
        enc: { type: string, description: HPKE encapsulated key (base64) }
        ct: { type: string, description: HPKE ciphertext (base64) }
        sig: { type: string, description: Ed25519 signature by the DSH's identity key (base64) }
    SharedHostName:
      type: object
      required: [name]
      additionalProperties: false
      properties: { name: { type: string, minLength: 1, maxLength: 100 } }
    SharedHostKey:
      type: object
      required: [host, key]
      properties:
        host: { $ref: '#/components/schemas/SharedHost' }
        key: { type: string, description: 'The team host key, shown this once' }
    RelayHost:
      type: object
      required: [id, name, dshVersion, online, lastSeenAt, pairings]
      properties:
        id: { type: string }
        name: { type: string }
        dshVersion: { type: string }
        online: { type: boolean }
        lastSeenAt: { type: string, format: date-time }
        pairings:
          type: array
          items:
            type: object
            required: [id, deviceName, status, createdAt, lastUsedAt, push, current]
            properties:
              id: { type: string }
              deviceName: { type: string }
              status: { type: string, enum: [pending, confirmed] }
              createdAt: { type: string, format: date-time }
              lastUsedAt: { type: string, format: date-time, nullable: true }
              push: { type: boolean }
              current: { type: boolean, description: The pairing of the browser asking }
    RelayPairing:
      type: object
      required: [id, hostId, userId, hostName, deviceName, status, createdAt, lastUsedAt]
      properties:
        id: { type: string }
        hostId: { type: string }
        userId: { type: string, description: The member whose handset it is }
        hostName: { type: string }
        deviceName: { type: string }
        status: { type: string, enum: [pending, confirmed] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        online: { type: boolean }
        push: { type: boolean }
    BudgetNotice:
      type: object
      required: [id, recipientId, threshold, state, createdAt, nextAt, code]
      properties:
        id: { type: string }
        recipientId: { type: string }
        threshold: { type: integer }
        state: { type: string, enum: [pending, sending, sent, failed, skipped] }
        createdAt: { type: string, format: date-time }
        nextAt: { type: string, format: date-time }
        code: { type: string }
    UsageResolution:
      type: object
      required: [reason, tokens, points]
      properties:
        reason: { type: string, minLength: 8, maxLength: 500 }
        points: { type: string, nullable: true }
        tokens:
          type: object
          required: [input, cacheRead, cacheWrite, output, reasoning]
          properties:
            input: { type: integer, minimum: 0 }
            cacheRead: { type: integer, minimum: 0 }
            cacheWrite: { type: integer, minimum: 0 }
            output: { type: integer, minimum: 0 }
            reasoning: { type: integer, minimum: 0 }
    BudgetPolicyInput:
      type: object
      required: [scope, subjectId, period, timezone, revision, enabled, notify, points, input, output, total]
      properties:
        scope: { type: string, enum: [team, member, default_member, provider] }
        subjectId: { type: string }
        period: { type: string, enum: [day, month] }
        timezone: { type: string }
        revision: { type: integer }
        enabled: { type: boolean }
        notify: { type: string, enum: [admins, owner, both, none] }
        points: { type: string, nullable: true }
        input: { type: integer, nullable: true }
        output: { type: integer, nullable: true }
        total: { type: integer, nullable: true }
    BudgetPolicy:
      allOf:
        - { $ref: '#/components/schemas/BudgetPolicyInput' }
        - type: object
          required: [id, activeTimezone, effectiveAt, inheritsDefault]
          properties:
            id: { type: string }
            activeTimezone: { type: string }
            effectiveAt: { type: string, nullable: true, format: date-time }
            inheritsDefault: { type: boolean }
    TeamSummary:
      type: object
      required: [since, calls, points, unpriced, unresolved, failedNotices, nearLimit, budget, pendingReviews]
      properties:
        since: { type: string, format: date-time, description: "Start of the counted period, 30 days back" }
        calls: { type: integer, minimum: 0, description: "Model calls in the period; the team's for an admin, the caller's own for a member" }
        points: { type: string, description: "Reference points spent in the period: priced model calls and edition meters" }
        unpriced: { type: integer, minimum: 0, description: "Calls in the period without a price yet, which points leaves out" }
        unresolved: { type: integer, minimum: 0, description: "Model calls an admin must resolve, from any time; 0 for a member. Metered rows are settled by their edition" }
        failedNotices: { type: integer, minimum: 0, description: "Budget mail that could not be delivered; 0 for a member" }
        nearLimit:
          type: array
          description: Open budget windows at or past a notice threshold
          items:
            type: object
            required: [scope, subjectId, period, threshold]
            properties:
              scope: { type: string, enum: [team, member, provider] }
              subjectId: { type: string }
              period: { type: string, enum: [day, month] }
              threshold: { type: integer, enum: [80, 95, 100] }
        budget: { $ref: '#/components/schemas/QuotaSummary' }
        pendingReviews: { type: integer, minimum: 0, description: "Submissions awaiting review; the team's for an admin, the caller's own for a member" }
    QuotaSummary:
      type: object
      required: [remaining, state, resetAt, tokenLimited, exhausted]
      properties:
        remaining: { type: string, nullable: true, description: "Smallest current team/member points allowance after holds; advisory, not a wallet balance" }
        state: { type: string, enum: [known, unlimited, unconfirmed] }
        resetAt: { type: string, nullable: true, format: date-time, description: Earliest active policy boundary; other limits may remain exhausted afterwards. }
        tokenLimited: { type: boolean }
        exhausted: { type: boolean }
    BudgetWindow:
      type: object
      required: [id, scope, subjectId, period, startsAt, endsAt, spent, reserved, pointLimit, remaining, inputSpent, inputReserved, outputSpent, outputReserved, unpriced, unbounded]
      properties:
        id: { type: string }
        scope: { type: string, enum: [team, member, provider] }
        subjectId: { type: string }
        period: { type: string, enum: [day, month] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        spent: { type: string }
        reserved: { type: string }
        pointLimit: { type: string, nullable: true, description: Effective enabled points ceiling; null means no points cap }
        remaining: { type: string, nullable: true, description: Ceiling minus spent and reserved; null for unlimited or unconfirmed usage }
        inputSpent: { type: integer }
        inputReserved: { type: integer }
        outputSpent: { type: integer }
        outputReserved: { type: integer }
        unpriced: { type: integer }
        unbounded: { type: integer }
    ModelRateInput:
      type: object
      required: [revision, basis, input, cacheRead, cacheWrite, output]
      properties:
        revision: { type: integer, minimum: 0, maximum: 1000000000 }
        basis: { type: string, enum: [cost, weight] }
        input: { type: string }
        cacheRead: { type: string }
        cacheWrite: { type: string }
        output: { type: string }
    ModelRate:
      allOf:
        - { $ref: '#/components/schemas/ModelRateInput' }
        - type: object
          required: [configured]
          properties:
            readOnly: { type: boolean }
            configured: { type: boolean }
    UsageEntry:
      type: object
      required: [id, userId, hostId, configId, provider, model, state, code, createdAt, finishedAt, input, cacheRead, cacheWrite, output, reasoning, points, meter]
      properties:
        id: { type: string }
        userId:
          description: The member who made the call; empty for a shared DSH's.
          type: string
        hostId:
          description: The shared DSH that made the call (ADR 0047); empty for a member's.
          type: string
        configId: { type: string }
        provider: { type: string }
        model: { type: string }
        state: { type: string, enum: [running, settled, unpriced, pending, failed, estimated] }
        code: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, nullable: true, format: date-time }
        input: { type: integer, nullable: true }
        cacheRead: { type: integer, nullable: true }
        cacheWrite: { type: integer, nullable: true }
        output: { type: integer, nullable: true }
        reasoning: { type: integer, nullable: true }
        points: { type: string, nullable: true }
        meter:
          description: An edition's metered usage (ADR 0036); null on a model call.
          type: object
          nullable: true
          required: [name, unit, quantity, labels, unitLabels]
          properties:
            name: { type: string }
            unit: { type: string }
            quantity: { type: integer, nullable: true }
            labels: { type: object, additionalProperties: { type: string } }
            unitLabels: { type: object, additionalProperties: { type: string } }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        scope: { type: string }
        resetAt: { type: string, format: date-time }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: array, items: { oneOf: [{ type: string }, { type: integer }] } }
              message: { type: string }
    Session:
      type: object
      required: [user, doors, setupOpen, appRedirect]
      properties:
        user:
          type: object
          nullable: true
          required: [id, email, name, mustChangePassword, changeWithoutCurrent]
          properties:
            id: { type: string }
            email: { type: string, nullable: true }
            name: { type: string, nullable: true }
            mustChangePassword: { type: boolean }
            changeWithoutCurrent:
              type: boolean
              description: This session signed in with the admin-set password, so it replaces it without the current one
        doors:
          type: object
          required: [password, emailCode, google]
          properties:
            password: { type: boolean }
            emailCode: { type: boolean }
            google: { type: boolean }
        setupOpen: { type: boolean }
        appRedirect: { type: string, description: "The phone app's sign-in address, where /plugin sends its code (ADR 0046)" }
    PasswordSignIn:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    Setup:
      type: object
      required: [token, email, password]
      properties:
        token: { type: string }
        email: { type: string }
        password: { type: string, minLength: 10, maxLength: 256 }
    ChangePassword:
      type: object
      required: [next]
      properties:
        current: { type: string, description: "Required unless the session's changeWithoutCurrent is true" }
        next: { type: string, minLength: 10, maxLength: 256 }
    PluginCodeRequest:
      type: object
      required: [challenge]
      properties:
        challenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        redirectUri: { type: string }
    PluginCode:
      type: object
      required: [code, returnTo]
      properties:
        code: { type: string }
        returnTo:
          type: object
          nullable: true
          required: [url, to]
          properties:
            url: { type: string }
            to: { type: string, enum: [dsh, app] }
    ModelCatalog:
      type: object
      required: [provider, models]
      properties:
        provider: { type: string }
        models:
          type: array
          items:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
              id: { type: string }
              name: { type: string }
              contextWindow: { type: integer }
              maxTokens: { type: integer }
    Provider:
      type: object
      required: [id, name, baseUrl, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        baseUrl: { type: string }
        updatedAt: { type: string, format: date-time }
    Tokens: { type: integer, minimum: 1, maximum: 10000000 }
    ModelMetadata:
      type: object
      required: [id, name, provider, prices]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        contextWindow: { $ref: '#/components/schemas/Tokens' }
        maxTokens: { $ref: '#/components/schemas/Tokens' }
        vision: { type: boolean }
        outputModalities: { type: array, items: { type: string } }
        prices:
          type: object
          description: Base USD per million text tokens. Absent rates are unknown, not free.
          additionalProperties: false
          properties:
            input: { type: string }
            output: { type: string }
            cacheRead: { type: string }
            cacheWrite: { type: string }
    ModelData:
      type: object
      required: [provider, model]
      additionalProperties: false
      properties:
        provider: { type: string }
        model: { type: string }
        vision: { type: boolean }
        contextWindow: { $ref: '#/components/schemas/Tokens' }
        maxTokens: { $ref: '#/components/schemas/Tokens' }
    PresetData:
      type: object
      additionalProperties: false
      description: Inherits the session model, references a team model, or names a provider/model; exactly one choice.
      properties:
        inheritModel: { type: boolean }
        provider: { type: string }
        model: { type: string }
        contextWindow: { $ref: '#/components/schemas/Tokens' }
        maxTokens: { $ref: '#/components/schemas/Tokens' }
        modelConfigId: { type: string }
        description: { type: string }
        instructions: { type: string }
        outputDescription: { type: string }
        pluginDependencies:
          type: array
          items:
            type: object
            required: [pluginConfigId, version]
            properties:
              pluginConfigId: { type: string }
              version: { type: string }
        requiredTools: { type: array, items: { type: string } }
        optionalTools: { type: array, items: { type: string } }
        systemPrompt: { type: string }
    PluginData:
      type: object
      required: [package, version]
      additionalProperties: false
      properties:
        artifactId: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        package: { type: string }
        version: { type: string }
        providesTools: { type: array, items: { type: string } }
        description: { type: string }
    ConfigInput:
      type: object
      required: [kind, name, data]
      properties:
        kind: { type: string, enum: [model, preset, plugin] }
        name: { type: string, minLength: 1, maxLength: 120 }
        data:
          oneOf:
            - { $ref: '#/components/schemas/ModelData' }
            - { $ref: '#/components/schemas/PresetData' }
            - { $ref: '#/components/schemas/PluginData' }
    Config:
      type: object
      required: [id, kind, name, data, version, updatedAt]
      properties:
        builtin: { type: string, enum: [team-assistant] }
        owner: { type: string, description: Protected route owner; absent for ordinary BYOK configurations. }
        id: { type: string }
        kind: { type: string, enum: [model, preset, plugin] }
        name: { type: string }
        data:
          type: object
          additionalProperties: true
          description: The kind's data (ModelData, PresetData or PluginData) as stored.
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    Snapshot:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items:
            type: object
            required: [teamId, teamName, role, configs]
            properties:
              teamId: { type: string }
              teamName: { type: string }
              role: { type: string, enum: [admin, member] }
              configs: { type: array, items: { $ref: '#/components/schemas/Config' } }
              pluginVersions:
                type: array
                items:
                  type: object
                  required: [configId, name, data]
                  properties:
                    configId: { type: string }
                    name: { type: string }
                    data: { $ref: '#/components/schemas/PluginData' }
    Team:
      type: object
      required: [id, name, role, members]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, member] }
        members:
          type: array
          items:
            type: object
            required: [userId, email, role]
            properties:
              userId: { type: string }
              email: { type: string, nullable: true }
              role: { type: string, enum: [admin, member] }
    Invite:
      type: object
      required: [id, expiresAt, usedAt]
      properties:
        id: { type: string }
        expiresAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time, nullable: true }
    Profile:
      type: object
      required: [id, email, name, image, locale]
      additionalProperties: false
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
        name: { type: string, nullable: true }
        image: { type: string, nullable: true }
        locale: { type: string, nullable: true, enum: [en, zh-CN, null] }
    SubmissionInput:
      type: object
      required: [config, baseVersion, note]
      additionalProperties: false
      properties:
        config: { $ref: '#/components/schemas/ConfigInput' }
        configId: { type: string }
        baseVersion: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 2000 }
    ReviewInput:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 2000 }
    ResourceSubmission:
      type: object
      required: [id, configId, baseVersion, proposal, note, authorId, state, revision, reviewerId, reason, createdAt, updatedAt, decidedAt]
      properties:
        id: { type: string }
        configId: { type: string }
        baseVersion: { type: integer }
        proposal: { $ref: '#/components/schemas/ConfigInput' }
        note: { type: string }
        authorId: { type: string }
        state: { type: string, enum: [draft, pending, published, rejected, withdrawn] }
        revision: { type: integer }
        reviewerId: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    ResourceArtifact:
      type: object
      required: [id, package, version, sha256, size, files, published]
      properties:
        id: { type: string }
        package: { type: string }
        version: { type: string }
        sha256: { type: string }
        size: { type: integer, minimum: 0 }
        files: { type: array, items: { type: string } }
        published: { type: boolean }
    ConfigRevision:
      type: object
      required: [id, configId, kind, name, data, version, authorId, reviewerId, note, source, createdAt]
      properties:
        id: { type: string }
        configId: { type: string }
        kind: { type: string, enum: [model, preset, plugin] }
        name: { type: string }
        data: { type: object, additionalProperties: true }
        version: { type: integer, minimum: 1 }
        authorId: { type: string }
        reviewerId: { type: string }
        note: { type: string }
        source: { type: string, enum: [system, legacy, direct, approved] }
        createdAt: { type: string, format: date-time }
