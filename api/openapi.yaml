      responses:
        '200':
          description: The tree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeTree' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/spaces:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      summary: Create a space, read by the whole team; the team's admin's
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeName' }
      responses:
        '201':
          description: The space
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeSpace' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/spaces/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Rename a space or name its templates folder; an editor's
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                templatesFolderId: { type: string, description: 'A folder of the space, or empty for no templates' }
      responses:
        '204': { description: Changed }
        default: { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a space with everything in it; an editor's
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/spaces/{id}/access:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Who reads and who edits a space, besides its creator and the team's admins; an editor's
      responses:
        '200':
          description: The access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeAccess' }
        default: { $ref: '#/components/responses/Error' }
    put:
      summary: Replace a space's access at once; an editor's
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeAccess' }
      responses:
        '200':
          description: The access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeAccess' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/folders:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      summary: Create a folder in a space; an editor's
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spaceId, name]
              properties:
                spaceId: { type: string }
                parentId: { type: string }
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: The folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeFolder' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/folders/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Rename a folder; an editor's
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeName' }
      responses:
        '204': { description: Renamed }
        default: { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete an empty folder (knowledge_folder_not_empty otherwise); an editor's
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/documents:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      summary: Create a document and its version 1; an editor's
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spaceId, title, text]
              properties:
                spaceId: { type: string }
                folderId: { type: string }
                title: { type: string, minLength: 1, maxLength: 120 }
                text: { type: string }
                note: { type: string, maxLength: 200 }
      responses:
        '201':
          description: The document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocument' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/documents/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: A document the caller reads, with its versions and the text of one (the current one by default)
      parameters:
        - { name: version, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocument' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      summary: Rename a document or move it to another folder of its space; an editor's
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                folderId: { type: string }
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocument' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a document with its versions and proposals; an editor's
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/documents/{id}/versions:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Save a new version on top of baseVersion (knowledge_stale when it is no longer current); an editor's, never an agent's
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion, text]
              properties:
                baseVersion: { type: integer, minimum: 1 }
                text: { type: string }
                note: { type: string, maxLength: 200 }
      responses:
        '201':
          description: The document at its new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocument' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/documents/{id}/versions/{n}/restore:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      summary: Add a version copying version n; an editor's
      responses:
        '201':
          description: The document at its new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocument' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/documents/{id}/proposals:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Propose a change on top of baseVersion; any reader's, and the only change an agent makes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion, text]
              properties:
                baseVersion: { type: integer, minimum: 1 }
                text: { type: string }
                note: { type: string, maxLength: 200 }
                computer: { type: string, maxLength: 64 }
                sessionId: { type: string, maxLength: 128 }
      responses:
        '201':
          description: The proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeProposalDetail' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/search:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: The documents the caller reads whose title or current text holds q, ignoring case; title matches first, at most 30
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        '200':
          description: What was found
          content:
            application/json:
              schema:
                type: object
                required: [results]
                additionalProperties: false
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/KnowledgeFound' } }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/mentions:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: 'The documents the caller reads whose current text mentions them, @[Name](their-id), newest change first'
      responses:
        '200':
          description: The documents
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                additionalProperties: false
                properties:
                  documents: { type: array, items: { $ref: '#/components/schemas/KnowledgeFound' } }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/spaces/{id}/documents:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: The documents directly in one folder of a space, or at its root, with their front matter, for a table of their properties
      parameters:
        - { name: folderId, in: query, schema: { type: string }, description: Empty or absent for the space's root }
      responses:
        '200':
          description: The rows
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                additionalProperties: false
                properties:
                  rows: { type: array, items: { $ref: '#/components/schemas/KnowledgeRow' } }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/documents/{id}/comments:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Every comment on a document the caller reads, oldest first
      responses:
        '200':
          description: The comments
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                additionalProperties: false
                properties:
                  comments: { type: array, items: { $ref: '#/components/schemas/KnowledgeComment' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Open a thread on a quote of a version, or reply to one; a reader's, never an agent's
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                parentId: { type: string, description: The thread a reply joins; empty to open one }
                version: { type: integer, description: The version a thread is written on }
                quote: { type: string, maxLength: 500 }
                anchor: { type: string, maxLength: 200, description: The slug of the heading above the quote }
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: The comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeComment' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/comments/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Resolve a thread, or open it again; its author's or an editor's
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolved]
              additionalProperties: false
              properties:
                resolved: { type: boolean }
      responses:
        '204': { description: Changed }
        default: { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a comment, and a thread's replies with it; its author's or an editor's
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/documents/{id}/attachments:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Attach a file to a document the caller reads (any reader, or their plugin); the same name with the same bytes is the same attachment, with other bytes knowledge_name_taken
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Its file name is the attachment's name }
      responses:
        '200':
          description: The attachment, already held
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeAttachment' }
        '201':
          description: The attachment, stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeAttachment' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/documents/{id}/attachments/{name}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      summary: An attachment's bytes, under a sandbox; an image or PDF inline, anything else as a download
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '304': { description: Unchanged }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/proposals:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: Proposals to the spaces the caller edits, and their own, newest first
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [pending, accepted, declined, withdrawn] } }
      responses:
        '200':
          description: The proposals
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                additionalProperties: false
                properties:
                  proposals: { type: array, items: { $ref: '#/components/schemas/KnowledgeProposal' } }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/proposals/{id}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One proposal with its text and the text it started from
      responses:
        '200':
          description: The proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeProposalDetail' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/knowledge/proposals/{id}/{action}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [accept, decline, withdraw] } }
    post:
      summary: Accept (a new version under its author's name), decline with a reason (an editor's), or withdraw (its author's) a pending proposal
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: The proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeProposalDetail' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/history:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      summary: Immutable publication history for team members, newest first
      parameters:
        - { name: configId, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [model, preset, plugin] } }
        - { name: authorId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: At most fifty immutable publications
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ConfigRevision' } }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/history/{id}/restore:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: An administrator restores a historical team configuration as a new version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion, note]
              additionalProperties: false
              properties:
                baseVersion: { type: integer, minimum: 0 }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Restored configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }
        default: { $ref: '#/components/responses/Error' }
  /teams/{teamId}/history/{id}/export:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Export a resource manifest and retained plugin packages; administrator only
      responses:
        '200':
          description: Backup archive, without provider keys or authentication material
          content:
            application/gzip:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /relay:
    get:
      summary: Where the relay's plugin socket is (ADR 0044; docs/tech/relay.md)
      security: []
      responses:
        '200':
          description: >-
            The plugin socket's address, and whether a phone may turn notifications
            on here: only a server its edition gave a way to deliver them, never a
            self-hosted one
          content:
            application/json:
              schema:
                type: object
                required: [url, push]
                properties: { url: { type: string }, push: { type: boolean } }
  /relay/plugin:
    servers: [{ url: / }]
    get:
      summary: The plugin's relay socket (WebSocket); its first frame is a hello with its Bearer token
      security: []
      responses:
        '101':
          description: Switched to the relay's frames (docs/tech/relay.md, Frames)
  /relay/phone:
    servers: [{ url: / }]
    get:
      summary: A phone's or a browser's relay socket (WebSocket); its first frame is a hello with its token and handset credential
      description: 'A page of this site may leave the token out: its session cookie, with an Origin of APP_URL, admits it instead.'
      security: []
      responses:
        '101':
          description: Switched to the relay's frames (docs/tech/relay.md, Frames)
  /relay/pair:
    servers: [{ url: / }]
    post:
      summary: A phone redeems a pairing code its owner's DSH showed
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: X-Device-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, deviceName]
              properties: { code: { type: string }, deviceName: { type: string } }
      responses:
        '201':
          description: The pending pairing
          content:
            application/json:
              schema:
                type: object
                required: [pairing]
                properties: { pairing: { $ref: '#/components/schemas/RelayPairing' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /relay/pairings:
    servers: [{ url: / }]
    get:
      summary: This handset's pairings
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: X-Device-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: The pairings
          content:
            application/json:
              schema:
                type: object
                required: [pairings]
                properties: { pairings: { type: array, items: { $ref: '#/components/schemas/RelayPairing' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /relay/hosts:
    servers: [{ url: / }]
    get:
      summary: "The member's own computers: the web console sees each with every device of theirs paired to it (ADR 0048), the app the same computers with its own pairings only"
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: X-Device-Key, in: header, required: false, schema: { type: string }, description: "The caller's handset credential, to mark its own pairings; required with a Bearer" }
      responses:
        '200':
          description: The computers, most recently seen first
          content:
            application/json:
              schema:
                type: object
                required: [hosts]
                properties: { hosts: { type: array, items: { $ref: '#/components/schemas/RelayHost' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /relay/hosts/{id}/web/ticket:
    post:
      summary: Issue a one-time entry ticket for the owner's online native DSH Web
      description: >-
        Spending it starts a session (ADR 0065) whose Teamwork bar leads back to returnTo, the member's own My DSH page,
        for a browser; to the phone app for a Bearer; else to the console's home.
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                returnTo: { type: string, pattern: '^/teams/[A-Za-z0-9_-]{1,64}/my-dsh(/[A-Za-z0-9_-]{1,64})?$' }
      responses:
        '200':
          description: URL to open within one minute
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties: { url: { type: string, format: uri } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /relay/hosts/{id}:
    servers: [{ url: / }]
    patch:
      summary: "Rename an owned computer from the web console or a confirmed paired handset"
      security: [{ session: [] }, { bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Device-Key, in: header, required: false, schema: { type: string }, description: Required with a Bearer token }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, minLength: 1, maxLength: 100, description: Trimmed of spaces } }
      responses:
        '204': { description: Renamed }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: "Sign one of the member's own computers out and forget it with every pairing to it, connected or not (ADR 0060; the web console only)"
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Signed out and deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /relay/pairings/{id}:
    servers: [{ url: / }]
    delete:
      summary: Revoke a pairing; an app's own handset's, or from the web console any of the member's own computers' (ADR 0048)
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Device-Key, in: header, required: false, schema: { type: string }, description: "The app's handset credential; the web console need not send it" }
      responses:
        '204': { description: Revoked }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /relay/pairings/{id}/push:
    servers: [{ url: / }]
    put:
      summary: >-
        Turn a pairing's notifications on (an Expo push token) or off (null); on is
        409 push_unavailable where GET /api/relay says push is false
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Device-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken]
              properties: { pushToken: { type: string, nullable: true }, locale: { type: string } }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: dsh-teamwork-session }
    bearer:
      type: http
      scheme: bearer
      description: A plugin token. GET /api/configs and the model gateway also accept a computer token (ADR 0038), limited to its one team.
  responses:
    Error:
      description: A refusal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    KnowledgeName:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    KnowledgePerson:
      type: object
      required: [id, name, email]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        email: { type: string, nullable: true }
    KnowledgeFolder:
      type: object
      required: [id, parentId, name]
      additionalProperties: false
      properties:
        id: { type: string }
        parentId: { type: string, description: Empty at the space's root }
        name: { type: string }
    KnowledgeDocumentSummary:
      type: object
      required: [id, folderId, title, currentVersion, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        folderId: { type: string, description: Empty at the space's root }
        title: { type: string }
        currentVersion: { type: integer }
        updatedAt: { type: string, format: date-time }
    KnowledgeSpace:
      type: object
      required: [id, name, reading, canEdit, templatesFolderId, folders, documents]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        reading: { type: string, enum: [team, members] }
        canEdit: { type: boolean }
        templatesFolderId: { type: string, description: 'The folder whose documents a new document may start from; empty for none' }
        folders: { type: array, items: { $ref: '#/components/schemas/KnowledgeFolder' } }
        documents: { type: array, items: { $ref: '#/components/schemas/KnowledgeDocumentSummary' } }
    KnowledgeTree:
      type: object
      required: [canCreateSpace, spaces]
      additionalProperties: false
      properties:
        canCreateSpace: { type: boolean }
        spaces: { type: array, items: { $ref: '#/components/schemas/KnowledgeSpace' } }
    KnowledgeAccess:
      type: object
      required: [reading, readers, editors]
      additionalProperties: false
      properties:
        reading: { type: string, enum: [team, members] }
        readers: { type: array, items: { type: string }, description: Member ids; kept only while reading is members }
        editors: { type: array, items: { type: string } }
    KnowledgeVersion:
      type: object
      required: [number, author, source, computer, sessionId, note, createdAt]
      additionalProperties: false
      properties:
        number: { type: integer }
        author: { $ref: '#/components/schemas/KnowledgePerson' }
        source: { type: string, enum: [console, agent] }
        computer: { type: string, description: The computer an agent's accepted proposal came from; empty otherwise }
        sessionId: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    KnowledgeDocument:
      type: object
      required: [id, folderId, title, currentVersion, updatedAt, spaceId, canEdit, version, text, versions, attachments, backlinks]
      additionalProperties: false
      properties:
        id: { type: string }
        folderId: { type: string }
        title: { type: string }
        currentVersion: { type: integer }
        updatedAt: { type: string, format: date-time }
        spaceId: { type: string }
        canEdit: { type: boolean }
        version: { type: integer, description: The version whose text this is }
        text: { type: string }
        versions: { type: array, items: { $ref: '#/components/schemas/KnowledgeVersion' } }
        attachments: { type: array, items: { $ref: '#/components/schemas/KnowledgeAttachment' }, description: 'The files the document may name, every version alike' }
        backlinks: { type: array, items: { $ref: '#/components/schemas/KnowledgeBacklink' }, description: 'The documents the caller reads whose current text links here' }
    KnowledgeFound:
      type: object
      required: [id, title, spaceId, version, titleMatch, heading, snippet, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string }
        spaceId: { type: string }
        version: { type: integer }
        titleMatch: { type: boolean }
        heading: { type: string, description: The heading above the line found; empty above the first }
        snippet: { type: string, description: 'The line found, at most 160 characters around it' }
        updatedAt: { type: string, format: date-time }
    KnowledgeRow:
      type: object
      required: [id, folderId, title, currentVersion, updatedAt, frontMatter]
      additionalProperties: false
      properties:
        id: { type: string }
        folderId: { type: string }
        title: { type: string }
        currentVersion: { type: integer }
        updatedAt: { type: string, format: date-time }
        frontMatter: { type: string, description: 'The current text''s YAML front matter with its fences, or empty' }
    KnowledgeComment:
      type: object
      required: [id, parentId, version, quote, anchor, body, author, createdAt, resolvedBy, resolvedAt, canResolve, canDelete]
      additionalProperties: false
      properties:
        id: { type: string }
        parentId: { type: string, description: Empty for a thread's first comment }
        version: { type: integer }
        quote: { type: string }
        anchor: { type: string }
        body: { type: string }
        author: { $ref: '#/components/schemas/KnowledgePerson' }
        createdAt: { type: string, format: date-time }
        resolvedBy:
          allOf: [{ $ref: '#/components/schemas/KnowledgePerson' }]
          nullable: true
        resolvedAt: { type: string, format: date-time, nullable: true }
        canResolve: { type: boolean }
        canDelete: { type: boolean }
    KnowledgeBacklink:
      type: object
      required: [id, title, spaceId]
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string }
        spaceId: { type: string }
    KnowledgeAttachment:
      type: object
      required: [name, contentType, size]
      additionalProperties: false
      properties:
        name: { type: string, description: 'Named in the text as ![[name]] (an embed) or [[name]] (a link)' }
        contentType: { type: string }
        size: { type: integer, format: int64 }
    KnowledgeProposal:
      type: object
      required: [id, documentId, documentTitle, spaceId, baseVersion, author, source, computer, sessionId, note, state, stale, canDecide, reason, version, createdAt, decidedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        documentId: { type: string }
        documentTitle: { type: string }
        spaceId: { type: string }
        baseVersion: { type: integer }
        author: { $ref: '#/components/schemas/KnowledgePerson' }
        source: { type: string, enum: [console, agent] }
        computer: { type: string }
        sessionId: { type: string }
        note: { type: string }
        state: { type: string, enum: [pending, accepted, declined, withdrawn] }
        stale: { type: boolean, description: Pending on a version that is no longer current }
        canDecide: { type: boolean }
        reason: { type: string }
        version: { type: integer, description: The version an acceptance made; 0 otherwise }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    KnowledgeProposalDetail:
      type: object
      required: [id, documentId, documentTitle, spaceId, baseVersion, author, source, computer, sessionId, note, state, stale, canDecide, reason, version, createdAt, decidedAt, text, baseText]
      additionalProperties: false
      properties:
        id: { type: string }
        documentId: { type: string }
        documentTitle: { type: string }
        spaceId: { type: string }
        baseVersion: { type: integer }
        author: { $ref: '#/components/schemas/KnowledgePerson' }
        source: { type: string, enum: [console, agent] }
        computer: { type: string }
        sessionId: { type: string }
        note: { type: string }
        state: { type: string, enum: [pending, accepted, declined, withdrawn] }
        stale: { type: boolean, description: Pending on a version that is no longer current }
        canDecide: { type: boolean }
        reason: { type: string }
        version: { type: integer, description: The version an acceptance made; 0 otherwise }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        text: { type: string }
        baseText: { type: string, description: The text of the version it started from }
    KnowledgeManifest:
      type: object
      required: [teams]
      additionalProperties: false
      properties:
        teams:
          type: array
          items:
            type: object
            required: [teamId, teamName, spaces]
            additionalProperties: false
            properties:
              teamId: { type: string }
              teamName: { type: string }
              spaces:
                type: array
                items:
                  type: object
                  required: [id, name, documents]
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    name: { type: string }
                    documents:
                      type: array
                      items:
                        type: object
                        required: [id, folders, title, version, attachments]
                        additionalProperties: false
                        properties:
                          id: { type: string }
                          folders: { type: array, items: { type: string }, description: Folder names from the space's root down }
                          title: { type: string }
                          version: { type: integer }
                          attachments:
                            type: array
                            items:
                              type: object
                              required: [name, size, digest]
                              additionalProperties: false
                              properties:
                                name: { type: string }
                                size: { type: integer, format: int64 }
                                digest: { type: string, description: Changes only when the bytes do }
    ArtifactUploadMeta:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 120 }
        kind: { type: string, enum: [html, svg] }
        note: { type: string, maxLength: 200 }
        sessionId: { type: string, maxLength: 128 }
        computer: { type: string, maxLength: 64 }
        baseVersion: { type: integer, minimum: 0 }
    ArtifactPublished:
      type: object
      required: [id, teamId, version, title, kind]
      additionalProperties: false
      properties:
        id: { type: string }
        teamId: { type: string }
        version: { type: integer }
        title: { type: string }
        kind: { type: string, enum: [html, svg] }
    ArtifactPerson:
      type: object
      required: [id, name, email]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        email: { type: string, nullable: true }
    ArtifactSummary:
      type: object
      required: [id, title, kind, sharing, owner, currentVersion, updatedAt, updatedBy, via]
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [html, svg] }
        sharing: { type: string, enum: [private, members, team] }
        owner: { $ref: '#/components/schemas/ArtifactPerson' }
        currentVersion: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/ArtifactPerson' }
        via: { type: string, enum: [you, team], nullable: true }
    ArtifactList:
      type: object
      required: [artifacts, next]
      additionalProperties: false
      properties:
        artifacts: { type: array, items: { $ref: '#/components/schemas/ArtifactSummary' } }
        next: { type: string, nullable: true }
    ArtifactDetail:
      type: object
      required: [id, title, kind, sharing, owner, currentVersion, updatedAt, updatedBy, via, access, members, versions]
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [html, svg] }
        sharing: { type: string, enum: [private, members, team] }
        owner: { $ref: '#/components/schemas/ArtifactPerson' }
        currentVersion: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/ArtifactPerson' }
        via: { type: string, enum: [you, team], nullable: true }
        access: { type: string, enum: [owner, reader, admin] }
        members: { type: array, items: { $ref: '#/components/schemas/ArtifactPerson' } }
        versions: { type: array, items: { $ref: '#/components/schemas/ArtifactVersion' } }
    ArtifactVersion:
      type: object
      required: [number, author, createdAt, note, computer, sessionId, size]
      additionalProperties: false
      properties:
        number: { type: integer }
        author: { $ref: '#/components/schemas/ArtifactPerson' }
        createdAt: { type: string, format: date-time }
        note: { type: string }
        computer: { type: string }
        sessionId: { type: string }
        size: { type: integer, format: int64 }
    ArtifactView:
      type: object
      required: [url, expiresAt, files]
      additionalProperties: false
      properties:
        url: { type: string }
        expiresAt: { type: string, format: date-time }
        files:
          type: array
          items:
            type: object
            required: [path, contentType, size]
            additionalProperties: false
            properties:
              path: { type: string }
              contentType: { type: string }
              size: { type: integer, format: int64 }
    RelayHost:
      type: object
      required: [id, name, dshVersion, pluginVersion, os, online, lastSeenAt, pairings]
      properties:
        id: { type: string }
        name: { type: string }
        dshVersion: { type: string }
        pluginVersion: { type: string, nullable: true, description: "The Teamwork plugin's version; null from a plugin too old to report it" }
        os: { $ref: '#/components/schemas/HostOs' }
        online: { type: boolean }
        webOnline: { type: boolean, description: Native Web is enabled and reachable for the owner }
        lastSeenAt: { type: string, format: date-time }
        pairings:
          type: array
          items:
            type: object
            required: [id, deviceName, status, createdAt, lastUsedAt, push, current]
            properties:
              id: { type: string }
              deviceName: { type: string }
              status: { type: string, enum: [pending, confirmed] }
              createdAt: { type: string, format: date-time }
              lastUsedAt: { type: string, format: date-time, nullable: true }
              push: { type: boolean }
              current: { type: boolean, description: The pairing of the browser or phone asking }
    HostOs:
      type: string
      enum: [macos, windows, linux, null]
      nullable: true
      description: "A member's computer's operating system as its plugin reports it; null for a plugin too old to report one"
    RelayPairing:
      type: object
      required: [id, hostId, userId, hostName, hostOs, hostLastSeenAt, deviceName, status, createdAt, lastUsedAt]
      properties:
        id: { type: string }
        hostId: { type: string }
        userId: { type: string, description: The member whose handset it is }
        hostName: { type: string }
        hostOs: { $ref: '#/components/schemas/HostOs' }
        hostLastSeenAt: { type: string, format: date-time, nullable: true, description: When its computer last connected to the relay; null for a computer the relay no longer knows }
        deviceName: { type: string }
        status: { type: string, enum: [pending, confirmed] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        online: { type: boolean }
        push: { type: boolean }
    BudgetNotice:
      type: object
      required: [id, recipientId, threshold, state, createdAt, nextAt, code]
      properties:
        id: { type: string }
        recipientId: { type: string }
        threshold: { type: integer }
        state: { type: string, enum: [pending, sending, sent, failed, skipped] }
        createdAt: { type: string, format: date-time }
        nextAt: { type: string, format: date-time }
        code: { type: string }
    UsageResolution:
      type: object
      required: [reason, tokens, points]
      properties:
        reason: { type: string, minLength: 8, maxLength: 500 }
        points: { type: string, nullable: true }
        tokens:
          type: object
          required: [input, cacheRead, cacheWrite, output, reasoning]
          properties:
            input: { type: integer, minimum: 0 }
            cacheRead: { type: integer, minimum: 0 }
            cacheWrite: { type: integer, minimum: 0 }
            output: { type: integer, minimum: 0 }
            reasoning: { type: integer, minimum: 0 }
    BudgetPolicyInput:
      type: object
      required: [scope, subjectId, period, timezone, revision, enabled, notify, points, input, output, total]
      properties:
        scope: { type: string, enum: [team, member, default_member, provider] }
        subjectId: { type: string }
        period: { type: string, enum: [day, month] }
        timezone: { type: string }
        revision: { type: integer }
        enabled: { type: boolean }
        notify: { type: string, enum: [admins, owner, both, none] }
        points: { type: string, nullable: true }
        input: { type: integer, nullable: true }
        output: { type: integer, nullable: true }
        total: { type: integer, nullable: true }
    BudgetPolicy:
      allOf:
        - { $ref: '#/components/schemas/BudgetPolicyInput' }
        - type: object
          required: [id, activeTimezone, effectiveAt, inheritsDefault]
          properties:
            id: { type: string }
            activeTimezone: { type: string }
            effectiveAt: { type: string, nullable: true, format: date-time }
            inheritsDefault: { type: boolean }
    TeamSummary:
      type: object
      required: [since, calls, points, unpriced, unresolved, overruns, failedNotices, nearLimit, unpricedModels, budget]
      properties:
        since: { type: string, format: date-time, description: "Start of the counted period, 30 days back" }
        calls: { type: integer, minimum: 0, description: "Model calls in the period, in the scope asked for" }
        points: { type: string, description: "Reference points spent in the period: priced model calls and edition meters" }
        unpriced: { type: integer, minimum: 0, description: "Calls in the period without a price yet, which points leaves out" }
        unresolved: { type: integer, minimum: 0, description: "Model calls whose usage is not known yet, from any time, that an admin may resolve; overruns excluded; 0 outside scope=team. Metered rows are settled by their edition" }
        overruns: { type: integer, minimum: 0, description: "Model calls past their admitted bound, from any time, which stop budgeted calls on their provider and model until an admin reviews them; 0 outside scope=team" }
        failedNotices: { type: integer, minimum: 0, description: "Budget mail that could not be delivered; 0 outside scope=team" }
        nearLimit:
          type: array
          description: Open budget windows at or past a notice threshold; outside scope=team, the team's, the providers' and the caller's own
          items:
            type: object
            required: [scope, subjectId, period, threshold]
            properties:
              scope: { type: string, enum: [team, member, provider] }
              subjectId: { type: string }
              period: { type: string, enum: [day, month] }
              threshold: { type: integer, enum: [80, 95, 100] }
        unpricedModels:
          type: array
          description: The team's models no call reaches until a rate is set for the provider and upstream model they call now; empty outside scope=team
          items: { type: string }
        budget: { $ref: '#/components/schemas/QuotaSummary' }
    UsageStats:
      type: object
      required: [since, until, timezone, totals, days, sources, members]
      properties:
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        timezone: { type: string }
        totals:
          type: object
          required: [calls, points, unpriced, input, cacheRead, cacheWrite, output, reasoning]
          properties:
            calls: { type: integer, minimum: 0, description: Model calls; edition meters are no calls }
            points: { type: string, description: "Points spent: priced model calls and edition meters" }
            unpriced: { type: integer, minimum: 0, description: "Calls whose points are not known yet, which points leaves out" }
            input: { type: integer, minimum: 0, description: "Input tokens, cache reads and writes included" }
            cacheRead: { type: integer, minimum: 0 }
            cacheWrite: { type: integer, minimum: 0 }
            output: { type: integer, minimum: 0, description: "Output tokens, reasoning included" }
            reasoning: { type: integer, minimum: 0 }
        days:
          type: array
          description: Every calendar day of the period in timezone, oldest first, spent on or not
          items:
            type: object
            required: [day, calls, points]
            properties:
              day: { type: string, format: date }
              calls: { type: integer, minimum: 0 }
              points: { type: string }
        sources:
          type: array
          description: What each team model and edition meter spent, most points first
          items:
            type: object
            required: [kind, key, name, labels, calls, points, input, output]
            properties:
              kind: { type: string, enum: [model, meter] }
              key: { type: string, description: "A model's configuration id, or a meter's name" }
              name: { type: string, description: "The model's current name (its upstream model once removed), or the meter's name" }
              labels: { type: object, additionalProperties: { type: string }, description: "A meter's name in each language its edition registered; empty for a model" }
              calls: { type: integer, minimum: 0 }
              points: { type: string }
              input: { type: integer, minimum: 0 }
              output: { type: integer, minimum: 0 }
        members:
          type: array
          description: "What each member spent, most points first; only the reader when the read is one member's"
          items:
            type: object
            required: [userId, calls, points, input, output]
            properties:
              userId: { type: string }
              calls: { type: integer, minimum: 0, description: Model calls; edition meters are no calls }
              points: { type: string, description: "Points spent: priced model calls and edition meters" }
              input: { type: integer, minimum: 0 }
              output: { type: integer, minimum: 0 }
    QuotaSummary:
      type: object
      required: [remaining, state, resetAt, tokenLimited, exhausted]
      properties:
        remaining: { type: string, nullable: true, description: "Smallest current team/member points allowance after holds; advisory, not a wallet balance" }
        state: { type: string, enum: [known, unlimited, unconfirmed] }
        resetAt: { type: string, nullable: true, format: date-time, description: Earliest active policy boundary; other limits may remain exhausted afterwards. }
        tokenLimited: { type: boolean }
        exhausted: { type: boolean }
    BudgetWindow:
      type: object
      required: [id, scope, subjectId, period, startsAt, endsAt, spent, reserved, pointLimit, remaining, inputSpent, inputReserved, outputSpent, outputReserved, unpriced, unbounded]
      properties:
        id: { type: string }
        scope: { type: string, enum: [team, member, provider] }
        subjectId: { type: string }
        period: { type: string, enum: [day, month] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        spent: { type: string }
        reserved: { type: string }
        pointLimit: { type: string, nullable: true, description: Effective enabled points ceiling; null means no points cap }
        remaining: { type: string, nullable: true, description: Ceiling minus spent and reserved; null for unlimited or unconfirmed usage }
        inputSpent: { type: integer }
        inputReserved: { type: integer }
        outputSpent: { type: integer }
        outputReserved: { type: integer }
        unpriced: { type: integer }
        unbounded: { type: integer }
    ModelRateInput:
      type: object
      required: [revision, basis, input, cacheRead, cacheWrite, output]
      properties:
        revision: { type: integer, minimum: 0, maximum: 1000000000 }
        basis: { type: string, enum: [cost, weight] }
        input: { type: string }
        cacheRead: { type: string }
        cacheWrite: { type: string }
        output: { type: string }
    ModelRate:
      allOf:
        - { $ref: '#/components/schemas/ModelRateInput' }
        - type: object
          required: [configured]
          properties:
            readOnly: { type: boolean }
            configured: { type: boolean }
    UsageEntry:
      type: object
      required: [id, userId, configId, provider, model, state, code, createdAt, finishedAt, input, cacheRead, cacheWrite, output, reasoning, points, meter]
      properties:
        id: { type: string }
        userId:
          description: The member who made the call.
          type: string
        configId: { type: string }
        provider: { type: string }
        model: { type: string }
        state: { type: string, enum: [running, settled, unpriced, pending, failed, estimated] }
        code: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, nullable: true, format: date-time }
        input: { type: integer, nullable: true }
        cacheRead: { type: integer, nullable: true }
        cacheWrite: { type: integer, nullable: true }
        output: { type: integer, nullable: true }
        reasoning: { type: integer, nullable: true }
        points: { type: string, nullable: true }
        meter:
          description: An edition's metered usage (ADR 0036); null on a model call.
          type: object
          nullable: true
          required: [name, unit, quantity, labels, unitLabels]
          properties:
            name: { type: string }
            unit: { type: string }
            quantity: { type: integer, nullable: true }
            labels: { type: object, additionalProperties: { type: string } }
            unitLabels: { type: object, additionalProperties: { type: string } }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        scope: { type: string }
        resetAt: { type: string, format: date-time }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: array, items: { oneOf: [{ type: string }, { type: integer }] } }
              message: { type: string }
    Session:
      type: object
      required: [user, doors, setupOpen, appRedirect]
      properties:
        user:
          type: object
          nullable: true
          required: [id, email, name, mustChangePassword, changeWithoutCurrent]
          properties:
            id: { type: string }
            email: { type: string, nullable: true }
            name: { type: string, nullable: true }
            mustChangePassword: { type: boolean }
            changeWithoutCurrent:
              type: boolean
              description: This session signed in with the admin-set password, so it replaces it without the current one
        doors:
          type: object
          required: [password, emailCode, google]
          properties:
            password: { type: boolean }
            emailCode: { type: boolean }
            google: { type: boolean }
        setupOpen: { type: boolean }
        appChallenge: { type: string, description: "The pending phone login can authorize only this PKCE challenge." }
        pendingVerification: { type: boolean, description: "A second verification is pending before this browser signs in." }
        appRedirect: { type: string, description: "The phone app's sign-in address, where /plugin sends its code (ADR 0046)" }
    PasswordSignIn:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    Setup:
      type: object
      required: [token, email, password]
      properties:
        token: { type: string }
        email: { type: string }
        password: { type: string, minLength: 10, maxLength: 256 }
    ChangePassword:
      type: object
      required: [next]
      properties:
        current: { type: string, description: "Required unless the session's changeWithoutCurrent is true" }
        next: { type: string, minLength: 10, maxLength: 256 }
    PluginCodeRequest:
      type: object
      required: [challenge]
      properties:
        challenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        redirectUri: { type: string }
    PluginCode:
      type: object
      required: [code, returnTo]
      properties:
        code: { type: string }
        returnTo:
          type: object
          nullable: true
          required: [url, to]
          properties:
            url: { type: string }
            to: { type: string, enum: [dsh, app] }
    ModelCatalog:
      type: object
      required: [provider, models]
      properties:
        provider: { type: string }
        models:
          type: array
          items:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
              id: { type: string }
              name: { type: string }
              contextWindow: { type: integer }
              maxTokens: { type: integer }
    Provider:
      type: object
      required: [id, name, baseUrl, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        baseUrl: { type: string }
        updatedAt: { type: string, format: date-time }
    Tokens: { type: integer, minimum: 1, maximum: 10000000 }
    ModelMetadata:
      type: object
      required: [id, name, provider, prices]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        contextWindow: { $ref: '#/components/schemas/Tokens' }
        maxTokens: { $ref: '#/components/schemas/Tokens' }
        vision: { type: boolean }
        reasoningEfforts:
          type: array
          uniqueItems: true
          items: { type: string, enum: [minimal, low, medium, high, xhigh, max] }
        outputModalities: { type: array, items: { type: string } }
        prices:
          type: object
          description: Base USD per million text tokens. Absent rates are unknown, not free.
          additionalProperties: false
          properties:
            input: { type: string }
            output: { type: string }
            cacheRead: { type: string }
            cacheWrite: { type: string }
    ModelData:
      type: object
      required: [provider, model]
      additionalProperties: false
      properties:
        provider: { type: string }
        model: { type: string }
        vision: { type: boolean }
        reasoningEfforts:
          type: array
          uniqueItems: true
          items: { type: string, enum: [minimal, low, medium, high, xhigh, max] }
        contextWindow: { $ref: '#/components/schemas/Tokens' }
        maxTokens: { $ref: '#/components/schemas/Tokens' }
        offline: { type: boolean, description: "A hosted model its service has taken out of service; only that service sets it, and an admin's model is refused with it" }
    PresetData:
      type: object
      additionalProperties: false
      description: Inherits the session model, references a team model, or names a provider/model; exactly one choice.
      properties:
        inheritModel: { type: boolean }
        provider: { type: string }
        model: { type: string }
        contextWindow: { $ref: '#/components/schemas/Tokens' }
        maxTokens: { $ref: '#/components/schemas/Tokens' }
        modelConfigId: { type: string }
        avatar:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,39}$'
          description: A preset avatar's id from the clients' library (packages/shared); a client draws an id it does not know, or none, as one picked from the preset's id.
        description: { type: string }
        instructions: { type: string }
        outputDescription: { type: string }
        pluginDependencies:
          type: array
          items:
            type: object
            required: [pluginConfigId, version]
            properties:
              pluginConfigId: { type: string }
              version: { type: string }
        requiredTools: { type: array, items: { type: string } }
        optionalTools: { type: array, items: { type: string } }
        systemPrompt: { type: string }
    PluginData:
      type: object
      required: [package, version]
      additionalProperties: false
      properties:
        packageId: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        package: { type: string }
        version: { type: string }
        providesTools: { type: array, items: { type: string } }
        description: { type: string }
    PersonalChoice:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [latest, pinned, removed, default] }
        version: { type: integer, minimum: 1, description: The pinned version; only with pinned }
    TeamDefault:
      type: object
      required: [version, name, revision]
      properties:
        version: { type: integer }
        name: { type: string }
        revision: { type: integer }
        adoptedVersions: { type: array, items: { type: integer } }
    AssetChoices:
      type: object
      required: [personal, defaults, users, off, archived]
      properties:
        personal: { type: object, additionalProperties: { $ref: '#/components/schemas/PersonalChoice' } }
        defaults: { type: object, additionalProperties: { $ref: '#/components/schemas/TeamDefault' } }
        users: { type: object, description: "Members each preset and plugin reaches, by configuration id", additionalProperties: { type: integer, minimum: 0 } }
        off: { type: object, description: "The caller's computers (relay host ids) each item stays off, by configuration id", additionalProperties: { type: array, items: { type: string } } }
        archived: { type: array, items: { $ref: '#/components/schemas/Config' } }
    ConfigInput:
      type: object
      required: [kind, name, data]
      properties:
        memberAsset: { type: boolean, description: Create a member-owned asset in the team directory. }
        kind: { type: string, enum: [model, preset, plugin] }
        name: { type: string, minLength: 1, maxLength: 120 }
        data:
          oneOf:
            - { $ref: '#/components/schemas/ModelData' }
            - { $ref: '#/components/schemas/PresetData' }
            - { $ref: '#/components/schemas/PluginData' }
    Config:
      type: object
      required: [id, kind, name, data, version, updatedAt]
      properties:
        assetArchived: { type: boolean }
        assetOwnerId: { type: string, description: Account ID of the member who owns this asset. }
        builtin: { type: string, enum: [team-assistant] }
        owner: { type: string, description: Protected route owner; absent for ordinary BYOK configurations. }
        id: { type: string }
        kind: { type: string, enum: [model, preset, plugin] }
        name: { type: string }
        data:
          type: object
          additionalProperties: true
          description: The kind's data (ModelData, PresetData or PluginData) as stored.
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    Snapshot:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items:
            type: object
            required: [teamId, teamName, role, configs]
            properties:
              teamId: { type: string }
              teamName: { type: string }
              role: { type: string, enum: [admin, member] }
              configs: { type: array, items: { $ref: '#/components/schemas/Config' } }
              pluginVersions:
                type: array
                items:
                  type: object
                  required: [configId, name, data]
                  properties:
                    configId: { type: string }
                    name: { type: string }
                    data: { $ref: '#/components/schemas/PluginData' }
    Team:
      type: object
      required: [id, name, role, members]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, member] }
        members:
          type: array
          items:
            type: object
            required: [userId, email, role]
            properties:
              name: { type: string }
              userId: { type: string }
              email: { type: string, nullable: true }
              role: { type: string, enum: [admin, member] }
    Invite:
      type: object
      required: [id, expiresAt, usedAt]
      properties:
        id: { type: string }
        expiresAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time, nullable: true }
    Profile:
      type: object
      required: [id, email, name, image, locale]
      additionalProperties: false
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
        name: { type: string, nullable: true }
        image: { type: string, nullable: true }
        locale: { type: string, nullable: true, enum: [en, zh-CN, null] }
    ResourceSubmission:
      type: object
      required: [id, configId, baseVersion, proposal, note, authorId, state, revision, reviewerId, reason, createdAt, updatedAt, decidedAt]
      properties:
        id: { type: string }
        configId: { type: string }
        baseVersion: { type: integer }
        proposal: { $ref: '#/components/schemas/ConfigInput' }
        note: { type: string }
        authorId: { type: string }
        state: { type: string, enum: [draft, pending, published, rejected, withdrawn] }
        revision: { type: integer }
        reviewerId: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    PluginPackage:
      type: object
      required: [id, package, version, sha256, size, files, published]
      properties:
        id: { type: string }
        package: { type: string }
        version: { type: string }
        sha256: { type: string }
        size: { type: integer, minimum: 0 }
        files: { type: array, items: { type: string } }
        published: { type: boolean }
    ConfigRevision:
      type: object
      required: [id, configId, kind, name, data, version, authorId, reviewerId, note, source, createdAt]
      properties:
        id: { type: string }
        configId: { type: string }
        kind: { type: string, enum: [model, preset, plugin] }
        name: { type: string }
        data: { type: object, additionalProperties: true }
        version: { type: integer, minimum: 1 }
        authorId: { type: string }
        reviewerId: { type: string }
        note: { type: string }
        source: { type: string, enum: [system, legacy, direct, approved] }
        createdAt: { type: string, format: date-time }
