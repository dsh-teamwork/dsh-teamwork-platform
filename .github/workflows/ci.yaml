name: CI

# CI runs on a merge into main, on every pull request and on demand. Every step
# of `build` is the same gate `.husky/pre-push` runs before a branch leaves the
# machine; a pull request runs it too, because a contributor's machine is not
# ours to trust. A push to a feature branch alone runs nothing. A private
# edition (this file is shared with it) skips pull requests: its minutes are
# billed, so it runs on a merge into main and on demand only.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Keep only the newest run for a pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: ubuntu-latest

    # A mocked database cannot see what a database decides, so the suites that
    # need one run on real ones: Postgres and MySQL here, and SQLite in-process
    # (ADR 0014).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The Go server's suites run every database case on SQLite, and on these
      # two servers too, in a scratch database each (server/internal/testdb).
      TEST_POSTGRES_URL: postgres://postgres:postgres_password@localhost:5432/postgres?sslmode=disable
      TEST_MYSQL_URL: mysql://root:mysql_password@localhost:3306/mysql
      # Its drift check empties these (server/scripts/drift.mjs).
      MIGRATE_DEV_POSTGRES: postgres://postgres:postgres_password@localhost:5432/go_drift?sslmode=disable
      MIGRATE_DEV_MYSQL: mysql://root:mysql_password@localhost:3306/go_drift
      # Every turbo run writes .turbo/runs/<id>.json, naming each task's hash;
      # the last step keeps only those entries in the cache.
      TURBO_RUN_SUMMARY: "true"

    steps:
      - uses: actions/checkout@v4
      # The version lives in `.nvmrc` — one Node for CI and a contributor's
      # shell. server/Dockerfile names the same version; a bump changes both.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install node modules
        run: pnpm install --frozen-lockfile

      # A closed edition (where premium/ exists) leaves out the open server's
      # suites: its open files equal the community edition's (the edition
      # boundary below), whose CI ran them on all three databases. It runs
      # its own, on SQLite and Postgres only. OPEN_SUITES is empty here.
      - name: Edition
        run: |
          if [ -d premium ]; then echo 'OPEN_SUITES=--filter=!@dsh-teamwork/go-server' >> "$GITHUB_ENV"; fi

      # Turbo's own cache, carried between runs. The key is unique per run on
      # purpose: a hit on the primary key skips the post-job save and freezes
      # the cache at whichever run wrote it first; `restore-keys` is what
      # actually matches, and takes the most recent entry. The last step,
      # "Prune the Turbo cache", keeps it to one run's entries. The `pruned`
      # prefix keeps the entries saved before that step existed from ever
      # being restored: they had grown to several gigabytes, and restoring one
      # took the runner down inside this step.
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-pruned-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-pruned-${{ runner.os }}-

      - name: Type check
        run: pnpm tsc

      - name: Language check
        run: pnpm lint:lang

      - name: Docs check
        run: pnpm lint:docs

      - name: Icons check
        run: pnpm assets:icons --check

      - name: Lint
        run: pnpm lint

      # Replays every migration into a scratch database of each dialect and
      # compares the result with the ent schema, so a schema change no
      # migration holds cannot land unnoticed.
      - name: Migration drift
        run: |
          PGPASSWORD=postgres_password psql -h localhost -U postgres -c 'CREATE DATABASE go_drift'
          mysql -h 127.0.0.1 -uroot -pmysql_password -e 'CREATE DATABASE go_drift'
          pnpm db:drift $OPEN_SUITES

      - name: Test
        run: pnpm test $OPEN_SUITES

      - name: Build
        run: pnpm build

      # The DSH plugin, unchanged, against the Go server on all three
      # databases: sign in on loopback, sync, call a model (server/e2e). A
      # branch is tested with the plugin's branch of the same name where the
      # plugin has one, since work that spans both repositories changes both
      # at once; otherwise with the plugin's main.
      - name: Choose the plugin's branch
        id: plugin
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/dsh-teamwork/dsh-teamwork "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
          echo "Plugin branch: $(grep ref= "$GITHUB_OUTPUT" | tail -1)"

      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          repository: dsh-teamwork/dsh-teamwork
          ref: ${{ steps.plugin.outputs.ref }}
          path: _plugin

      # Every Go module with an e2e directory runs it: the open server's, or
      # the closed one's where this tree has it.
      - name: Plugin end to end
        run: |
          (cd _plugin && pnpm install --frozen-lockfile --ignore-scripts)
          for dir in $(git ls-files '*e2e/*_test.go' | xargs -n1 dirname | sort -u); do
            [ -z "$OPEN_SUITES" ] || [ "$dir" != server/e2e ] || continue
            (cd "$dir/.." && go test -tags e2e ./e2e)
          done
        env:
          DSH_TEAMWORK_PLUGIN: ${{ github.workspace }}/_plugin

      # The closed edition only: every open path must equal the community
      # edition it last merged (docs/tech/community-edition.md).
      - name: Edition boundary
        if: hashFiles('premium/scripts/lint-edition.mjs') != ''
        run: node premium/scripts/lint-edition.mjs

      # Turbo never deletes a cache entry, so without this every run saves
      # all earlier runs' entries plus its own (two Go binaries and the built
      # consoles, about 90 MB per merge), and the archive only grows. Keep the
      # entries this run's turbo invocations hit or wrote, by the hashes their
      # run summaries name; the post-job save then stores one run's worth.
      - name: Prune the Turbo cache
        run: |
          node -e '
            const fs = require("fs");
            const used = new Set();
            for (const f of fs.readdirSync(".turbo/runs"))
              for (const task of JSON.parse(fs.readFileSync(`.turbo/runs/${f}`, "utf8")).tasks) used.add(task.hash);
            for (const f of fs.readdirSync(".turbo/cache"))
              if (!used.has(f.split(/[-.]/)[0])) fs.rmSync(`.turbo/cache/${f}`);
          '
          du -sh .turbo/cache

  # The release, packed exactly as the release workflow packs it: five
  # binaries, their npm packages and the launcher (server/scripts/pack.mjs).
  # Community distribution checks belong to Platform; downstream editions run
  # the full build gate above without repacking the unchanged community server.
  pack:
    if: github.repository == 'dsh-teamwork/dsh-teamwork-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build the console
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --filter @dsh-teamwork/web... --filter @dsh-teamwork/manage...
          pnpm --filter @dsh-teamwork/web --filter @dsh-teamwork/manage build
      - name: Pack
        run: node server/scripts/pack.mjs 0.0.0-ci.${{ github.run_number }}
      # Test these tarballs on this Linux runner from an empty npm cache.
      # Keeping install/start beside packing avoids another checkout, toolchain
      # setup and artifact transfer. The scratch registry never publishes to npm.
      - name: Start a registry
        run: |
          mkdir -p "$RUNNER_TEMP/registry"
          cat > "$RUNNER_TEMP/registry/config.yaml" <<'YAML'
          storage: ./storage
          auth: { htpasswd: { file: ./htpasswd } }
          uplinks: {}
          packages:
            '@dsh-teamwork/*': { access: $all, publish: $anonymous }
          max_body_size: 100mb
          log: { type: stdout, format: pretty, level: warn }
          YAML
          npx --yes verdaccio@6.11.1 --config "$RUNNER_TEMP/registry/config.yaml" --listen 127.0.0.1:4873 > "$RUNNER_TEMP/registry/log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4873/-/ping && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/registry/log"; exit 1
      - name: Install with npx, start, and serve
        run: node server/scripts/smoke-npm.mjs http://127.0.0.1:4873 server/dist/release 0.0.0-ci.${{ github.run_number }}

  # Self-hosting as README.md describes it: build server/Dockerfile, start
  # compose.yaml with no .env at all, and check the server answers and prints
  # the link that claims the first account. No Google, PostHog or SMTP account
  # is involved.
  self-host:
    if: github.repository == 'dsh-teamwork/dsh-teamwork-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: The server answers
        run: |
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
          for path in / /sign-in /robots.txt; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$path $status"
            test "$status" = 200
          done
          docker compose logs server | grep -F 'http://localhost:3000/setup?token='

      # The SQLite file and the generated secrets are in the volume, so a new
      # container starts on the same instance.
      - name: The data outlives the container
        run: |
          before=$(docker compose logs server | grep -o 'setup?token=[A-Za-z0-9_-]*' | head -1)
          docker compose down
          docker compose up -d --wait
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
          after=$(docker compose logs server | grep -o 'setup?token=[A-Za-z0-9_-]*' | head -1)
          echo "$before / $after"
          test -n "$before" && test "$before" = "$after"

      - name: Logs on failure
        if: failure()
        run: docker compose logs
