# Self-hosting: the server image, its SQLite file and its secrets in one
# volume (README.md, "Self-hosting"). Every setting comes from a `.env` beside
# this file; set DATABASE_URL there to use Postgres or MySQL instead.
name: dsh-teamwork

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container the port is fixed; the published one is PORT.
      PORT: 3000
      # One team on its own network: its models may live beside it (ADR 0006).
      ALLOW_PRIVATE_PROVIDERS: ${ALLOW_PRIVATE_PROVIDERS:-true}
    ports:
      - ${PORT:-3000}:3000
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data: {}
