# Self-hosting: Postgres and the web app (README.md, "Self-hosting").
# Every setting comes from a `.env` beside this file; apps/web/.env.example
# lists them. The database is reachable only from the web container.
name: dsh-teamwork

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dsh_teamwork
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dsh_teamwork -q"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Read at build as well as at run (apps/web/Dockerfile).
      args:
        APP_URL: ${APP_URL:-}
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/dsh_teamwork
      # One team on its own network: its models may live beside it (ADR 0006).
      ALLOW_PRIVATE_PROVIDERS: ${ALLOW_PRIVATE_PROVIDERS:-true}
    ports:
      - ${WEB_PORT:-3000}:3000
    restart: unless-stopped

volumes:
  db: {}
