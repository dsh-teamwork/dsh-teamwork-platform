# The local databases for the Go server's suites and drift check: `pnpm
# dev:setup`. The same images and credentials as CI's services, so
# TEST_POSTGRES_URL, TEST_MYSQL_URL, MIGRATE_DEV_POSTGRES and MIGRATE_DEV_MYSQL
# read the same locally and there. The server itself needs none of this: with
# no DATABASE_URL it runs on SQLite in its data directory.
name: dsh-teamwork-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_USER: postgres
      POSTGRES_DB: go_drift
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q"]
      interval: 5s
      timeout: 60s
      start_period: 60s
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data/

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql_password
      MYSQL_DATABASE: go_drift
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -pmysql_password"]
      interval: 5s
      timeout: 60s
      start_period: 60s
    ports:
      - 3306:3306
    volumes:
      - mysql:/var/lib/mysql

# Not the old stack's `pgdata`: an existing volume skips POSTGRES_DB, so
# go_drift would never be created on it.
volumes:
  postgres: {}
  mysql: {}
