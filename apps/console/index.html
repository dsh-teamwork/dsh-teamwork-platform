<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <title>DSH Teamwork</title>
    <script>
      // The theme before the first paint: the person's choice, else the system's (src/lib/theme.ts, THEME_SCRIPT).
      (function () {
        var t = 'system';
        try {
          var s = localStorage.getItem('theme');
          if (s === 'light' || s === 'dark') t = s;
        } catch (e) {}
        var r = document.documentElement;
        r.dataset.themeChoice = t;
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) r.classList.add('dark');
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
